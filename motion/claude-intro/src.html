<!doctype html>
<html lang="fr">
<head>

<style>

</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="hud"><button id="pp" title="Lecture / pause (Espace)">▶</button><input id="sc" type="range" min="0" max="1799" value="0"><span id="tc">0.00 s</span></div>
<audio id="au" src="claude-intro-audio.m4a" preload="auto"></audio>
<script>
'use strict';
// ------------------------------------------------------------------ setup
const W = 1920, H = 1080, FPS = 60, T = 30, SHUTTER = 0.5;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c');
const main = cv.getContext('2d');
const scr = document.createElement('canvas'); scr.width = W; scr.height = H;
const sctx = scr.getContext('2d');
let ctx = RENDER ? sctx : main;

// ------------------------------------------------------------------ math
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const ioq = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const out = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const o5 = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 5);
const inn = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
// closed-form spring step response (stiffness k, damping ratio z, unit mass)
function spring(t, k = 170, z = .8) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k);
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------------ palette & type
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const P = {
  cream: hex('#f0eee6'), ink: hex('#141413'), clay: hex('#d97757'), paper: hex('#faf9f5'),
  mute: hex('#87847b'), line: hex('#d6d2c6'), night: hex('#141413'), card: hex('#22211e'),
  bubble: hex('#34322e'), sand: hex('#cdbb9f'), warm: hex('#ead2bd'), dim: hex('#77746c'), chrome: hex('#4a4843'),
};
const rgb = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const SANS = (s, w = 600) => `${w} ${s}px InterV, Inter, "IPAGothic", sans-serif`;
const SER = s => `italic 400 ${s}px InstrSerif, serif`;
const MONO = s => `500 ${s}px JBM, "DejaVu Sans Mono", monospace`;

const mcache = new Map();
function tw(s, font, ls = 0) {
  const k = font + '|' + ls + '|' + s;
  let v = mcache.get(k);
  if (v === undefined) { sctx.font = font; sctx.letterSpacing = ls + 'px'; v = sctx.measureText(s).width; mcache.set(k, v); }
  return v;
}
function txt(s, x, y, font, col, o = {}) {
  ctx.font = font; ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.textAlign = o.align || 'left';
  ctx.fillStyle = typeof col === 'string' ? col : rgb(col, o.alpha === undefined ? 1 : o.alpha);
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
// masked rise: a word rises into its own line box (pin 0..1) and leaves through the top (pout 0..1)
function rise(s, x, y, font, col, pin, pout, o = {}) {
  if (pin <= 0.0005 || pout >= 0.9995) return;
  const lh = o.lh || 100, ls = o.ls || 0, rot = o.rot === undefined ? .06 : o.rot;
  const w = tw(s, font, ls);
  ctx.save();
  ctx.beginPath(); ctx.rect(x - lh * .45, y - lh * 1.02, w + lh * .9, lh * 1.36); ctx.clip();
  ctx.translate(x, y + (1 - pin) * lh * 1.12 - pout * lh * 1.4);
  ctx.rotate((1 - pin) * rot - pout * rot * .5);
  txt(s, 0, 0, font, col, { ls, alpha: o.alpha });
  ctx.restore();
}
const pulse = (t, b, a, tau = .16) => t < b ? 0 : a * (1 - Math.exp(-(t - b) / .025)) * Math.exp(-(t - b) / tau);

// ------------------------------------------------------------------ timeline constants
const TT = [0.42, 0.53, 0.62, 0.75, 0.84, 0.95, 1.06], PT = 1.22;   // "Bonjour" keystrokes, caret -> period
const B = { size: 200, ls: -9, y: 612 };
const VT = [6.02, 7.5, 9.0, 10.5];                                  // verbs
const PH = ['Je lis.', 'J’écris.', 'Je code.', 'Je raisonne.'];
const OC = { x: 1340, y: 540 };                                     // object centre in scene 3
const NODE_T0 = 10.86;
const CW = 780, CH = 480, FOC = 1100, DF = FOC / 1.3, ZDOT = 9200, FLOOR = 520;
const CARDS = [
  { x: -430, y: -40, z: 1500, kind: 'chat', title: 'Discuter', tag: 'ILLUSTRATION' },
  { x: 440, y: 50, z: 3000, kind: 'term', title: 'Coder', tag: 'ILLUSTRATION' },
  { x: -400, y: 10, z: 4500, kind: 'chart', title: 'Analyser', tag: 'DONNÉES D’EXEMPLE' },
  { x: 420, y: -40, z: 6000, kind: 'lang', title: 'Traduire', tag: 'ILLUSTRATION' },
];
const ARR = [14.0, 16.1, 18.1, 20.1], LEAVE = [15.4, 17.4, 19.4, 21.0];
const LANGS = ['Hello', 'Hola', 'Ciao', 'Привет', 'Olá', 'Γεια σου', 'Hallo', 'こんにちは', 'Bonjour'];
const LANG_T = [20.12]; [0.075, 0.075, 0.08, 0.09, 0.1, 0.11, 0.13, 0.16].forEach(d => LANG_T.push(LANG_T[LANG_T.length - 1] + d));
const BARS = [42, 55, 49, 68, 74, 91];
const CODE = [
  [['function', 'kw'], [' ', 'p'], ['saluer', 'fn'], ['(', 'p'], ['nom', 'var'], [') {', 'p']],
  [['  return ', 'kw'], ['`Bonjour, ${', 'str'], ['nom', 'var'], ['} !`', 'str'], [';', 'p']],
  [['}', 'p']],
  [],
  [['saluer', 'fn'], ['(', 'p'], ['"monde"', 'str'], [');', 'p']],
  [['// "Bonjour, monde !"', 'cm']],
];
const CODE_COL = { kw: P.clay, fn: P.cream, var: P.warm, str: P.sand, p: hex('#8b887f'), cm: P.dim };

// ------------------------------------------------------------------ layout (after fonts load)
const L = {};
function initLayout() {
  // scene 1
  const bf = SANS(B.size, 600);
  L.b = { font: bf, pre: [], adv: [] };
  for (let i = 0; i <= 7; i++) L.b.pre.push(i ? tw('Bonjour'.slice(0, i), bf, B.ls) : 0);
  for (let i = 0; i < 7; i++) L.b.adv.push(L.b.pre[i + 1] - L.b.pre[i]);
  L.b.wv = L.b.pre[7] - B.ls; L.b.pw = 46;
  const lx = 960 - (L.b.pre[7] + L.b.pw) / 2;
  L.P1 = { x: lx + L.b.wv + 10 + 18, y: B.y - 18 };
  // scene 2
  const s2 = L.s2 = { fa: SANS(150, 600), lsa: -6, fb: SER(244), lsb: -2, y: 618 };
  const wa = tw('Je suis', s2.fa, s2.lsa) - s2.lsa, wb = tw('Claude', s2.fb, s2.lsb) - s2.lsb;
  const total = wa + 46 + wb + 14 + 34;
  s2.x0 = 960 - total / 2; s2.xJe = s2.x0; s2.xSuis = s2.x0 + tw('Je ', s2.fa, s2.lsa);
  s2.xC = s2.x0 + wa + 46; s2.wC = wb; s2.preC = [];
  for (let k = 0; k < 6; k++) s2.preC.push(k ? tw('Claude'.slice(0, k), s2.fb, s2.lsb) : 0);
  L.P2 = { x: s2.xC + wb + 14 + 17, y: s2.y - 17 };
  s2.sub = 'Une IA conçue par Anthropic'; s2.fs = SANS(40, 500); s2.wSub = tw(s2.sub, s2.fs, -.5);
  // scene 3
  L.ph = { font: SANS(124, 600) };
  const r = mulberry32(11);
  L.page = { lis: [], ecr: [] };
  for (let j = 0; j < 9; j++) L.page.lis.push(j === 8 ? 150 : 236 + r() * 76);
  for (let j = 0; j < 7; j++) L.page.ecr.push(j === 6 ? 130 : 220 + r() * 92);
  L.code = CODE.map(line => { let x = 0; return line.map(([s, k]) => { const o = { s, k, x }; x += tw(s, MONO(24)); return o; }); });
  L.codeEnd = L.code[4].reduce((a, o) => Math.max(a, o.x + tw(o.s, MONO(24))), 0);
  const na = [-88, -32, 26, 84, 148, 212], nr = [214, 236, 204, 228, 216, 240];
  L.nodes = na.map((a, i) => ({ x: Math.cos(a * Math.PI / 180) * nr[i], y: Math.sin(a * Math.PI / 180) * nr[i] }));
  L.sats = na.map((a, i) => { const b = (a + 30) * Math.PI / 180, rr2 = 330 + (i % 2) * 26; return { x: Math.cos(b) * rr2, y: Math.sin(b) * rr2 * .86 }; });
  // 3D
  L.chat = { q: 'Explique-moi les trous noirs simplement.', qf: SANS(25, 500) };
  L.chat.qw = tw(L.chat.q, L.chat.qf);
  const af = SANS(25, 450), ans = 'Imagine un endroit où la gravité est si forte que même la lumière ne peut pas s’en échapper. C’est ça, un trou noir.'.split(' ');
  L.chat.af = af; L.chat.words = [];
  let x = 0, line = 0; const maxw = 600, sp = tw(' ', af);
  for (const w of ans) { const ww = tw(w, af); if (x + ww > maxw && x > 0) { x = 0; line++; } L.chat.words.push({ s: w, x, line }); x += ww + sp; }
  const rg = mulberry32(5); L.ghosts = [];
  while (L.ghosts.length < 20) {
    const g = { x: -1900 + rg() * 3800, y: -1050 + rg() * 1900, z: 300 + rg() * 9200, w: 280 + rg() * 380 };
    g.h = g.w * (.56 + rg() * .14); g.l = [.4 + rg() * .5, .3 + rg() * .5, .5 + rg() * .4];
    if (Math.abs(g.x) < 760 && Math.abs(g.y) < 560) continue;
    L.ghosts.push(g);
  }
  L.lang = { f: SANS(104, 600) }; L.lang.wB = tw('Bonjour', L.lang.f, -3) + 3;
  // scene 6
  const s6 = L.s6 = { f1: SANS(112, 600), ls1: -4.5, y1: 600, f3: SER(178), y2: 500, y3: 676 };
  const placeWords = (str, font, ls, cx, extra) => {
    const wv = tw(str, font, ls) - ls, x0 = cx - (wv + extra) / 2, words = [];
    let pos = 0; for (const w of str.split(' ')) { words.push({ s: w, x: x0 + tw(str.slice(0, pos), font, ls) }); pos += w.length + 1; }
    return { words, x0, wv };
  };
  const a1 = placeWords('Je vérifie mon travail', s6.f1, s6.ls1, 960, 12 + 30);
  s6.w1 = a1.words; L.P6a = { x: a1.x0 + a1.wv + 12 + 15, y: s6.y1 - 15 };
  s6.w2 = placeWords('Et je dis quand', s6.f1, s6.ls1, 960, 0).words;
  const a3 = placeWords('je ne sais pas', s6.f3, -1, 960, 10 + 30);
  s6.w3 = a3.words; L.P6b = { x: a3.x0 + a3.wv + 10 + 15, y: s6.y3 - 15 };
  // scene 7
  const s7 = L.s7 = { f: SER(232), y: 604, ft: SANS(46, 500), ty: 742, tag: 'On construit quoi ?' };
  s7.wC = tw('Claude', s7.f, -2) + 2; s7.wTag = tw(s7.tag, s7.ft, -1) + 1;
  const gw = 92 + 34 + s7.wC, gx = 960 - gw / 2;
  L.P7 = { x: gx + 46, y: s7.y - 64 }; s7.xC = gx + 92 + 34;
}

// ------------------------------------------------------------------ cues for the sound design
function buildCues() {
  const c = [];
  TT.forEach((t, i) => c.push({ t, k: 'key', i }));
  c.push({ t: PT, k: 'pop', i: 0 }, { t: 2.42, k: 'swoosh', i: 0 }, { t: 3.0, k: 'rise', i: 0 }, { t: 3.42, k: 'tick', i: 2 },
    { t: 4.0, k: 'swish', i: 0 }, { t: 4.75, k: 'rise', i: 1 }, { t: 5.42, k: 'swoosh', i: 1 });
  VT.forEach((t, i) => c.push({ t, k: 'tok', i }));
  for (let j = 0; j < 7; j++) c.push({ t: 7.86 + .145 * j, k: 'scribble', i: j, d: L.page.ecr[j] / 1800 });
  for (let i = 0; i < 6; i++) if (CODE[i].length) c.push({ t: 9.3 + .085 * i, k: 'tick', i });
  for (let i = 0; i < 6; i++) c.push({ t: NODE_T0 + .045 * i, k: 'pop', i: i + 1 });
  c.push({ t: 11.5, k: 'suck', i: 0, d: .5 }, { t: 12.0, k: 'impact', i: 0 }, { t: 12.15, k: 'dive', i: 0, d: 1.85 });
  c.push({ t: 13.85, k: 'pop', i: 3 });
  LEAVE.slice(0, 3).forEach((t, i) => c.push({ t, k: 'whoosh', i, d: ARR[i + 1] - t, pan: Math.sign(CARDS[i + 1].x - CARDS[i].x) }));
  for (let i = 0; i < 8; i++) c.push({ t: 16.12 + .045 * i, k: 'key', i: i + 7 });
  for (let i = 0; i < 3; i++) c.push({ t: 16.55 + .17 * i, k: 'tick', i: i + 3 });
  c.push({ t: 17.15, k: 'chime', i: 0 });
  for (let i = 0; i < 6; i++) c.push({ t: 18.12 + .06 * i, k: 'pop', i: i + 2 });
  c.push({ t: 18.55, k: 'swish', i: 1 }, { t: 19.15, k: 'tick', i: 6 });
  LANG_T.forEach((t, i) => c.push({ t, k: 'tick', i: 7 + i }));
  c.push({ t: 20.98, k: 'chime', i: 1 }, { t: 21.0, k: 'riser', i: 0, d: .9 }, { t: 21.9, k: 'impact', i: 1 },
    { t: 22.22, k: 'rise', i: 2 }, { t: 22.7, k: 'tick', i: 8 }, { t: 23.9, k: 'swoosh', i: 2 }, { t: 24.08, k: 'rise', i: 3 },
    { t: 24.62, k: 'tick', i: 9 }, { t: 25.4, k: 'swoosh', i: 3 }, { t: 26.0, k: 'boom', i: 0 }, { t: 26.38, k: 'shimmer', i: 0 },
    { t: 27.05, k: 'rise', i: 4 });
  return c.sort((a, b) => a.t - b.t);
}

// ------------------------------------------------------------------ cameras
function camZ(t) {
  let z = t < 12.2 ? 1 + .10 * io(seg(t, 0, 12)) : 1 + .03 * io(seg(t, 22.2, 26)) + .035 * out(seg(t, 26, 30));
  const P2D = [[1.5, .008], [3.42, .006], [6.0, .008], [7.5, .006], [9.0, .006], [10.5, .006], [22.7, .005], [24.62, .005], [26.0, .012]];
  for (const [b, a] of P2D) z *= 1 + pulse(t, b, a);
  return z;
}
function setCam(z) { ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z)); }
const lp3 = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: lerp(a.z, b.z, u) });
function cam3(t) {
  const f = k => ({ x: CARDS[k].x, y: CARDS[k].y, z: CARDS[k].z - DF });
  const drift = (k, tt) => { const p = f(k), u = io(seg(tt, ARR[k], LEAVE[k])); return { x: p.x + (k % 2 ? -16 : 16) * u, y: p.y + 6 * u, z: p.z + 70 * u }; };
  let c = null;
  if (t < ARR[0]) { const u = ioq(seg(t, 12.1, ARR[0])), p = f(0), s0 = { x: 380, y: -150, z: -900 }; c = { x: lerp(s0.x, p.x, io(seg(t, 12.1, ARR[0]))), y: lerp(s0.y, p.y, u), z: lerp(s0.z, p.z, u) }; }
  else {
    for (let k = 0; k < 4 && !c; k++) {
      if (t < LEAVE[k]) c = drift(k, t);
      else if (k < 3 && t < ARR[k + 1]) c = lp3(drift(k, LEAVE[k]), f(k + 1), io(seg(t, LEAVE[k], ARR[k + 1])));
    }
    if (!c) {
      // dive into the far dot: its on-screen radius grows exponentially (perceptually even) until it fills the frame
      const p = drift(3, LEAVE[3]), ux = out(seg(t, 21.0, 21.45)), u = Math.pow(seg(t, 21.0, 21.9), 1.6);
      const r0 = 30 * FOC / (ZDOT - p.z), r = r0 * Math.pow(1300 / r0, u);
      c = { x: lerp(p.x, 0, ux), y: lerp(p.y, 0, ux), z: ZDOT - 30 * FOC / r };
    }
  }
  for (let b = 12.5; b <= 20.5; b += .5) c.z += 11 * pulse(t, b, 1, .14);
  return c;
}

// ------------------------------------------------------------------ backgrounds
function bgCream(t, z) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgb(P.cream); ctx.fillRect(0, 0, W, H);
  const fx = 960 + 420 * Math.sin(t * .21 + 1), fy = 540 + 230 * Math.cos(t * .17);
  let g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 950);
  g.addColorStop(0, 'rgba(217,119,87,0.075)'); g.addColorStop(1, 'rgba(217,119,87,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const hx = 960 - 440 * Math.sin(t * .13), hy = 540 - 210 * Math.sin(t * .19 + 2);
  g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 820);
  g.addColorStop(0, 'rgba(255,255,255,0.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  setCam(z);
  ctx.fillStyle = 'rgba(20,20,19,0.075)';
  for (let x = 0; x <= W; x += 48) for (let y = 12; y <= H; y += 48) ctx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
}
function vignette(dark, k = 1) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(960, 540, 420, 960, 540, 1180);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, dark ? `rgba(0,0,0,${.42 * k})` : 'rgba(70,45,25,0.07)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ------------------------------------------------------------------ the protagonist (caret -> period -> object -> flood)
function lineX(t) {
  let x = 960;
  for (let i = 0; i < 7; i++) x -= L.b.adv[i] / 2 * spring(t - TT[i], 220, .9);
  return x - L.b.pw / 2 * spring(t - PT, 220, .9);
}
function caretState(t) {
  const lx = lineX(t);
  let typed = 0; for (let i = 0; i < 7; i++) if (t >= TT[i]) typed += L.b.adv[i];
  const m = spring(t - PT, 300, .82);
  const cx = lx + typed + 12, cy = B.y - 74, px = lx + L.b.wv + 10 + 18, py = B.y - 18;
  let a = 1;
  if (t < TT[0]) a = 1 - ss(seg(t, .2, .26)) + ss(seg(t, .32, .38));
  return { x: lerp(cx, px, m), y: lerp(cy, py, m), w: lerp(12, 36, m), h: lerp(150, 36, m), a };
}
function arcMove(p, q, t, t0, k, z, arc) {
  if (t <= t0) return p;
  const m = spring(t - t0, k, z);
  return { x: lerp(p.x, q.x, m), y: lerp(p.y, q.y, m) + arc * Math.sin(Math.PI * clamp(m)) };
}
function dotXY(t) {
  let p = t < 3.05 ? caretState(t) : L.P1;
  p = arcMove(p, L.P2, t, 3.05, 150, .8, -70);
  p = arcMove(p, OC, t, 5.6, 170, .8, 70);
  const k = io(seg(t, 11.5, 11.9));
  return { x: lerp(p.x, 960, k), y: lerp(p.y, 540, k) };
}
function objGeom(t) {
  const g = { w: 36, h: 36, r: 18, fill: P.clay };

}

// ------------------------------------------------------------------ scenes 6 and 7
function dotB(t) {
  let p = { x: 960, y: 540 };
  p = arcMove(p, L.P6a, t, 22.36, 160, .8, -50);
  p = arcMove(p, L.P6b, t, 24.28, 160, .8, -40);
  p = arcMove(p, { x: 960, y: 540 }, t, 25.55, 170, .8, -30);
  p = arcMove(p, L.P7, t, 26.3, 170, .8, 0);
  let r = lerp(18, 15, spring(t - 22.36, 170, .8));
  r = lerp(r, 46, spring(t - 25.98, 140, .76));
  r *= 1 + pulse(t, 22.7, .12, .12) + pulse(t, 24.62, .12, .12);
  return { x: p.x, y: p.y, r };
}
function drawS6(t) {
  if (t < 22.0 || t > 26.0) return;
  const g = L.s6;
  g.w1.forEach((w, j) => { const o = 23.9 + .035 * j; rise(w.s, w.x, g.y1, g.f1, P.ink, spring(t - (22.22 + .07 * j), 170, .8), inn(seg(t, o, o + .3)), { ls: g.ls1, lh: 122 }); });
  g.w2.forEach((w, j) => { const o = 25.4 + .03 * j; rise(w.s, w.x, g.y2, g.f1, P.ink, spring(t - (24.08 + .06 * j), 170, .8), inn(seg(t, o, o + .3)), { ls: g.ls1, lh: 122 }); });
  g.w3.forEach((w, j) => { const o = 25.46 + .03 * j; rise(w.s, w.x, g.y3, g.f3, P.ink, spring(t - (24.32 + .06 * j), 170, .8), inn(seg(t, o, o + .3)), { ls: -1, lh: 186, rot: .08 }); });
}
function drawS7(t, d) {
  if (t < 25.9) return;
  const g = L.s7;
  const rp = seg(t, 26.0, 26.95);
  if (rp > 0 && rp < 1) { circ(d.x, d.y, d.r + 190 * o5(rp)); ctx.strokeStyle = rgb(P.clay, .38 * (1 - rp)); ctx.lineWidth = 3; ctx.stroke(); }
  const rv = o5(seg(t, 26.38, 27.0));
  if (rv > 0) {
    ctx.save(); const xl = d.x + d.r + 2;
    ctx.beginPath(); ctx.rect(xl, g.y - 250, 2000, 340); ctx.clip();
    txt('Claude', g.xC - 70 * (1 - rv), g.y, g.f, P.ink, { ls: -2, alpha: clamp(rv * 1.5) });
    ctx.restore();
  }
  rise(g.tag, 960 - g.wTag / 2, g.ty, g.ft, P.ink, spring(t - 27.05, 170, .8), 0, { ls: -1, lh: 52, rot: .02, alpha: .72 });
  if (t > 27.45) {
    const ph = (t - 27.45) % 1, a = ph < .5 ? 1 - ss(seg(ph, .44, .5)) : ss(seg(ph, .94, 1));
    ctx.globalAlpha = a * seg(t, 27.45, 27.5);
    rr(960 + g.wTag / 2 + 12, g.ty - 40, 4, 50, 2); ctx.fillStyle = rgb(P.clay); ctx.fill(); ctx.globalAlpha = 1;
  }
}

// ------------------------------------------------------------------ frame composition
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowColor = 'rgba(0,0,0,0)';
  if (t < 12.5) {
    const z = camZ(t);
    bgCream(t, z);
    drawS1(t); drawS2(t); drawS3(t);
    if (t < 6.0) drawDot(t); else if (t < 12.0) drawObject(t);
    vignette(false);
    if (t >= 12.0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const Rf = Math.hypot(960, 540) * 1.06;
      const rc = lerp(15 * z * .75, Rf, o5(seg(t, 12.0, 12.32)));
      circ(960, 540, rc); ctx.fillStyle = rgb(P.clay); ctx.fill();
      const ri = Rf * o5(seg(t, 12.1, 12.46));
      if (ri > 0) { ctx.save(); circ(960, 540, ri); ctx.clip(); world3D(t); ctx.restore(); }
    }
  } else if (t < 21.9) {
    world3D(t);
  } else {
    const z = camZ(t);
    bgCream(t, z);
    drawS6(t);
    const d = dotB(t);
    drawS7(t, d);
    circ(d.x, d.y, d.r); ctx.fillStyle = rgb(P.clay); ctx.fill();
    vignette(false);
    if (t < 22.3) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const Rh = lerp(17.5, Math.hypot(960, 540) * 1.06, o5(seg(t, 21.9, 22.26)));
      ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(960, 540, Rh, 0, Math.PI * 2, true);
      ctx.fillStyle = rgb(P.clay); ctx.fill('evenodd');
    }
  }
}

// ------------------------------------------------------------------ grain, motion blur, render API
const GR = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry32(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 200; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
let GRP = null;
function grain(f) {
  if (!GRP) GRP = GR.map(c => main.createPattern(c, 'repeat'));
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalCompositeOperation = 'overlay'; main.globalAlpha = .07;
  main.translate(-((f * 53) % 256), -((f * 97) % 256));
  main.fillStyle = GRP[f % 3]; main.fillRect(0, 0, W + 256, H + 256);
  main.restore();
}
const FAST = [[2.4, 3.6], [5.25, 6.6], [8.95, 9.45], [10.45, 12.7], [12.7, 14.1], [15.5, 16.2], [17.5, 18.2], [19.5, 20.2], [20.1, 21.0], [21.0, 22.35], [23.85, 24.75], [25.35, 27.1]];
const TRAVEL = [[15.35, 16.15], [17.35, 18.15], [19.35, 20.15], [21.0, 21.95], [12.9, 13.9]];
function subN(t) { for (const [a, b] of TRAVEL) if (t >= a && t < b) return 28; for (const [a, b] of FAST) if (t >= a && t < b) return 12; return 4; }
window.renderFrame = f => {
  const t0 = f / FPS, N = subN(t0);
  for (let i = 0; i < N; i++) {
    const ts = clamp(t0 + ((i + .5) / N - .5) * SHUTTER / FPS, 0, T - 1e-6);
    draw(ts);
    main.globalAlpha = 1 / (i + 1); main.globalCompositeOperation = 'source-over'; main.setTransform(1, 0, 0, 1, 0, 0);
    main.drawImage(scr, 0, 0);
  }
  main.globalAlpha = 1; grain(f);
  return N;
};
window.seek = t => { ctx = main; draw(clamp(t, 0, T - 1e-6)); grain(Math.round(t * FPS)); if (RENDER) ctx = sctx; };

// ------------------------------------------------------------------ preview player
let playing = false, tcur = 0, last = null;
const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tc = document.getElementById('tc'), au = document.getElementById('au');
let audioOk = false; au.addEventListener('canplay', () => { audioOk = true; }); au.addEventListener('error', () => { audioOk = false; });
function setPlay(v) {
  playing = v; pp.textContent = v ? '❚❚' : '▶';
  if (audioOk) { if (v) { au.currentTime = tcur; au.play().catch(() => {}); } else au.pause(); }
}
function tick(now) {
  if (playing) {
    if (audioOk && !au.paused) tcur = au.currentTime;
    else if (last !== null) tcur += (now - last) / 1000;
    if (tcur >= T) { tcur = 0; if (audioOk) { au.currentTime = 0; au.play().catch(() => {}); } }
  }
  last = now;
  draw(tcur); grain(Math.round(tcur * FPS));
  sc.value = Math.round(tcur * FPS); tc.textContent = tcur.toFixed(2) + ' s / 30 s';
  requestAnimationFrame(tick);
}
function jump(t) { tcur = clamp(t, 0, T - 1 / FPS); if (audioOk) au.currentTime = tcur; }
pp.onclick = () => setPlay(!playing);
sc.oninput = () => jump(sc.value / FPS);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight') jump(tcur + (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'ArrowLeft') jump(tcur - (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'KeyR') { jump(0); setPlay(true); }
});

// ------------------------------------------------------------------ boot
(async () => {
  await Promise.all([SANS(100, 600), SANS(100, 450), SER(100), MONO(20)].map(f => document.fonts.load(f, 'BonjourÉé’')));
  await document.fonts.ready;
  initLayout();
  window.CUES = buildCues();
  window.ready = true;
  if (!RENDER) { const q = new URLSearchParams(location.search).get('t'); if (q) tcur = +q; requestAnimationFrame(tick); }
})();
</script>

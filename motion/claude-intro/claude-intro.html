<div id="hud"><button id="pp" title="Lecture / pause (Espace)">▶</button><input id="sc" type="range" min="0" max="2879" value="0"><span id="tc">0.00 s</span></div>

<script>
// ===== 00-core.js =====
'use strict';
// =====================================================================================================
//  Claude intro v3: core (canvases, math, palette, type helpers, noise, sprites)
//  Every frame is computed from the time alone: no state, no timers, every random value is seeded.
// =====================================================================================================
const W = 1920, H = 1080, FPS = 60, T = 48, SHUTTER = 0.5, TAU = Math.PI * 2;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c');
const main = cv.getContext('2d');
const scr = document.createElement('canvas'); scr.width = W; scr.height = H;
let ctx = scr.getContext('2d');   // every scene draws here, then it is composited (blur, shake, bloom, chroma, grain)
const SCR_CTX = ctx;
function withCtx(g, fn) { const prev = ctx; ctx = g; try { fn(); } finally { ctx = prev; } }   // draw with the same helpers onto another canvas (card textures)
function mk(w, h, read) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  return { c, g: c.getContext('2d', read ? { willReadFrequently: true } : undefined) };
}

// ------------------------------------------------------------------ math
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const ioq = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const out = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const o5 = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 5);
const inn = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const fract = x => x - Math.floor(x);
// closed-form spring step response (stiffness k, damping ratio z, unit mass)
function spring(t, k = 170, z = .8) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k);
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
// critically damped spring from x0 (initial velocity v0) to 0: used by the particle wordmark
const crit = (tau, w, A, v0) => (A + (v0 + w * A) * tau) * Math.exp(-w * tau);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pulse = (t, b, a, tau = .16) => t < b ? 0 : a * (1 - Math.exp(-(t - b) / .025)) * Math.exp(-(t - b) / tau);
const wrapAng = a => { a %= TAU; return a > Math.PI ? a - TAU : a < -Math.PI ? a + TAU : a; };

// ------------------------------------------------------------------ palette
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const BR = {
  cream: hex('#f0eee6'), paper: hex('#faf9f5'), ink: hex('#141413'), clay: hex('#d97757'), card: hex('#22211e'),
  mute: hex('#87847b'), line: hex('#d6d2c6'), bubble: hex('#34322e'), sand: hex('#cdbb9f'), warm: hex('#ead2bd'),
  dim: hex('#77746c'), chrome: hex('#4a4843'), night: hex('#0d0c12'),
};
// one hue per capability: the colour travels with the idea through the whole film
const HU = {
  coral: hex('#ff7a5a'), amber: hex('#ffb43c'), mint: hex('#3fd6a3'), sky: hex('#4fb3ff'),
  violet: hex('#9a7bff'), pink: hex('#ff6fae'), lime: hex('#b6e24a'), teal: hex('#2fd0d0'),
};
const HN = ['coral', 'amber', 'mint', 'sky', 'violet', 'pink'];
const CAP = { discuter: 'coral', coder: 'mint', analyser: 'amber', voir: 'violet', calculer: 'sky', traduire: 'pink' };
const rgb = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a <= 0 ? 0 : a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const RAINBOW = [[0, HU.coral], [.2, HU.amber], [.4, HU.mint], [.6, HU.sky], [.8, HU.violet], [1, HU.pink]];
function rainbow(u) {   // u in 0..1 along the six capability hues
  const f = clamp(u) * (HN.length - 1), i = Math.min(HN.length - 2, Math.floor(f));
  return mixc(HU[HN[i]], HU[HN[i + 1]], f - i);
}
const hueAt = i => HU[HN[((i % 6) + 6) % 6]];

// ------------------------------------------------------------------ type
const SANS = (s, w = 600) => `${w} ${s}px InterV, Inter, "IPAGothic", sans-serif`;
const SER = s => `italic 400 ${s}px InstrSerif, serif`;
const MONO = s => `500 ${s}px JBM, "DejaVu Sans Mono", monospace`;
const FRA = (s, w = 600) => `italic ${w} ${s}px Fraunces, InstrSerif, serif`;
const UNB = (s, w = 800) => `${w} ${s}px Unbounded, InterV, sans-serif`;
const SYN = (s, w = 800) => `${w} ${s}px Syne, InterV, sans-serif`;
const BRI = (s, w = 800) => `${w} ${s}px Bricolage, InterV, sans-serif`;
const ANT = s => `400 ${s}px Anton, InterV, sans-serif`;
const CAV = s => `700 ${s}px Caveat, cursive`;

const mcache = new Map();
const meas = mk(8, 8).g;
function tw(s, font, ls = 0) {
  const k = font + '|' + ls + '|' + s;
  let v = mcache.get(k);
  if (v === undefined) { meas.font = font; meas.letterSpacing = ls + 'px'; v = meas.measureText(s).width; mcache.set(k, v); }
  return v;
}
function txt(s, x, y, font, col, o = {}) {
  ctx.font = font; ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.textAlign = o.align || 'left';
  ctx.fillStyle = typeof col === 'string' ? col : rgb(col, o.alpha === undefined ? 1 : o.alpha);
  ctx.fillText(s, x, y);
}
function gtxt(s, x, y, font, stops, o = {}) {   // text filled with a horizontal gradient: stops = [[pos, [r,g,b], alpha?], ...]
  const w = tw(s, font, o.ls || 0), g = ctx.createLinearGradient(x, 0, x + w, 0);
  stops.forEach(([p, c, a]) => g.addColorStop(p, rgb(c, a === undefined ? (o.alpha === undefined ? 1 : o.alpha) : a)));
  ctx.font = font; ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.textAlign = 'left'; ctx.fillStyle = g; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
// masked rise: a word rises into its own line box (pin 0..1) and leaves through the top (pout 0..1)
function rise(s, x, y, font, col, pin, pout, o = {}) {
  if (pin <= 0.0005 || pout >= 0.9995) return;
  const lh = o.lh || 100, ls = o.ls || 0, rot = o.rot === undefined ? .06 : o.rot;
  const w = tw(s, font, ls);
  ctx.save();
  ctx.beginPath(); ctx.rect(x - lh * .45, y - lh * 1.02, w + lh * .9, lh * 1.36); ctx.clip();
  ctx.translate(x, y + (1 - pin) * lh * 1.12 - pout * lh * 1.4);
  ctx.rotate((1 - pin) * rot - pout * rot * .5);
  if (o.stops) gtxt(s, 0, 0, font, o.stops, { ls, alpha: o.alpha }); else txt(s, 0, 0, font, col, { ls, alpha: o.alpha });
  ctx.restore();
}
// a diagonal light sweep clipped to the shape of a word (drawn on top of the word); stops = gradient across the band
const SH = mk(1800, 560), shx = SH.g;
const SHEEN_BOW = [[0, HU.coral, 0], [.12, HU.coral, .95], [.3, HU.amber, .95], [.48, HU.mint, .95], [.66, HU.sky, .95], [.84, HU.violet, .95], [1, HU.pink, 0]];

// ------------------------------------------------------------------ film HUD: corner marks, chapter label, timecode, progress bar

// ------------------------------------------------------------------ the protagonist (caret -> period -> orb -> object)
function lineX(t) {
  let x = 960;
  for (let i = 0; i < 7; i++) x -= L.b.adv[i] / 2 * spring(t - TT[i], 220, .9);
  return x - L.b.pw / 2 * spring(t - PT, 220, .9);
}
function caretState(t) {
  const lx = lineX(t);

  const m = spring(t - PT, 300, .82);

  let a = ss(seg(t, .1, .16));

  const pop = spring(t - .1, 420, .55);

}
function arcMove(p, q, t, t0, k, z, arc) {

}

}

// ------------------------------------------------------------------ A: "Bonjour."
function drawA(t) {
  if (t > 4.0) return;

    const tt = TT[i]; if (t < tt) continue;
    const o0 = 3.42 + .028 * i, po = inn(seg(t, o0, o0 + .3));

    ctx.save();

    const s = .8 + .2 * sp, cx = x + L.b.adv[i] / 2;
    ctx.translate(cx, B.y + 16 * (1 - sp) - po * 310); ctx.rotate(-po * .06); ctx.scale(s, s);
    ctx.globalAlpha = a;

  if (n > 0) {
    const po = inn(seg(t, 3.36, 3.62));
    ctx.globalAlpha = 1 - po;
    txt(L.lbl.slice(0, n), 960 - L.lblW / 2, B.y - 236 - 30 * po, MONO(22), BR.mute, { ls: 3 });
    if (t < 3.3 && (n < L.lbl.length || ((t - 2.75) % .5) < .3)) {
      const cx = 960 - L.lblW / 2 + tw(L.lbl.slice(0, n), MONO(22), 3) + 4;
      ctx.fillStyle = rgb(BR.clay); ctx.fillRect(cx, B.y - 256, 12, 26);

  p = arcMove(p, { x: 960, y: 540 }, t, 33.22, 170, .8, -30);
  p = arcMove(p, L.P7, t, 36.25, 150, .8, 0);

  r = lerp(r, 38, spring(t - 33.3, 170, .8));

  [36.0, 36.13, 36.26].forEach((b, j) => { const rp = seg(t, b, b + 1.1); if (rp > 0 && rp < 1) { const cg = ctx.createConicGradient(t * 2 + j, 960, 540); RAINBOW.forEach(([p, c]) => cg.addColorStop(p, rgb(c, .8 * (1 - rp)))); cg.addColorStop(1, rgb(HU.coral, .8 * (1 - rp))); ctx.strokeStyle = cg; ctx.lineWidth = 3 + 7 * (1 - rp); circ(960, 540, 30 + [1000, 760, 520][j] * o5(rp)); ctx.stroke(); } });
  const u = seg(t, 36.0, 36.8);
  if (u > 0 && u < 1) { ctx.lineCap = 'round'; for (let i = 0; i < 16; i++) { const a = i * TAU / 16 + TAU / 32, r2 = 70 + (i % 2 ? 460 : 620) * o5(seg(t, 36.0, 36.5)), r1 = 70 + (i % 2 ? 350 : 470) * o5(seg(t, 36.06, 36.75)); if (r2 <= r1) continue; ctx.strokeStyle = rgb(hueAt(i), 1 - u * u); ctx.lineWidth = 3 + 6 * (1 - u); ctx.beginPath(); ctx.moveTo(960 + Math.cos(a) * r1, 540 + Math.sin(a) * r1); ctx.lineTo(960 + Math.cos(a) * r2, 540 + Math.sin(a) * r2); ctx.stroke(); } }

function drawEnding(t) {

// ===== 70-cues.js =====

function buildCues() {

  add(10.4, 'pop', { i: 3 });
  L.codeT.forEach((t, i) => { if (t > 0) add(t, 'type', { i, d: .1 }); });
  add(11.95, 'pop', { i: 2 }); add(12.05, 'ping', { i: 0 });
  for (let i = 0; i < 12; i++) add(12.58 + .03 * i, 'pop', { i: i % 6, soft: 1 });
  add(12.9, 'pop', { i: 1 }); add(13.05, 'pop', { i: 3 }); add(13.2, 'pop', { i: 5 }); add(13.62, 'suck', { d: .34 });
  // ---- D: the burst

  const A = ARR;

  for (let i = 0; i < 20; i++) add(A[0] - .02 + .03 * i, 'tick', { i: i % 5 + 2, soft: 1 });
  add(A[0] + 1.0, 'ping', { i: 1 }); [1.0, 1.1, 1.2].forEach((d, i) => add(A[0] + d, 'pop', { i: i + 1, soft: 1 })); add(A[0] + 1.2, 'ping', { i: 2 });
  // card 1 coder
  add(A[1] - .42, 'click', {}); for (let i = 0; i < 8; i++) add(A[1] - .42 + .04 * (i + 1), 'key', { i: i + 7 });
  [0, 1, 2].forEach(i => add(A[1] + .02 + .15 * i, 'check', { i })); add(A[1] + .55, 'chime', { i: 0 });
  // card 2 analyser
  for (let i = 0; i < 6; i++) add(A[2] - .4 + .05 * i, 'pop', { i: i + 1, soft: 1 });
  add(A[2] - .45, 'count', { d: .9 }); add(A[2], 'swish', { i: 1 }); add(A[2] + .48, 'ping', { i: 3 }); add(A[2] + .62, 'pop', { i: 2 });
  // card 3 voir
  add(A[3] - .38, 'scan', { d: .63 }); [.2, .3, .4].forEach((d, i) => add(A[3] + d, 'pop', { i: i * 2, soft: 1 })); for (let i = 0; i < 5; i++) add(A[3] + .7 + .07 * i, 'tick', { i: 2 + i });
  // card 4 calculer
  add(A[4] - .38, 'tok', { i: 0 }); add(A[4] + .15, 'tok', { i: 1 }); add(A[4] + .02, 'tick', { i: 3 }); add(A[4] + .42, 'tick', { i: 5 }); add(A[4] + .55, 'tok', { i: 3 }); add(A[4] - .3, 'swish', { i: 1 });
  add(A[4] + .55, 'pop', { i: 2 }); add(A[4] + .7, 'pop', { i: 4 }); add(A[4] + .85, 'pop', { i: 1 }); add(A[4] + .72, 'chime', { i: 1 });

  for (let k = 0; k < 5; k++) add(LEAVE[k], 'whoosh', { i: k, d: ARR[k + 1] - LEAVE[k], pan: Math.sign(CARDS[k + 1].x - CARDS[k].x) });
  add(LEAVE[5], 'riser', { d: T_DOT - LEAVE[5] });
  // ---- F: je vérifie / je ne sais pas
  add(28.0, 'impact', { i: 1 }); add(28.0, 'sparkle', { d: 1.2 });

// ===== 80-compose.js =====
// =====================================================================================================
//  The frame: which scene is on screen at time t, in which order things are drawn.
// =====================================================================================================
const BURST_T = [];                 // filled by the burst scene (times of the hard cuts, used by shake / chroma)
const SUBS = [                      // [from, to, sub-frames]: motion-blur budget
  [3.4, 3.95, 12], [7.2, 7.95, 12], [9.4, 9.55, 12], [10.95, 11.5, 12], [12.45, 12.95, 12], [13.55, 14.0, 12],
  [14.0, 15.75, 8], [15.75, 16.5, 16],
  [16.5, ARR[0], 24],
];
for (let k = 0; k < 5; k++) SUBS.push([LEAVE[k] - .05, ARR[k + 1] + .05, 26]);
SUBS.push([LEAVE[5] - .05, 28.0, 24], [28.0, 28.75, 12], [30.25, 30.95, 12], [33.05, 33.7, 12], [34.6, 36.0, 12], [36.0, 37.0, 16]);

function sceneABC(t) {
  const z = camZ(t);
  auroraCream(t, z, CUR_F);
  drawEmitters(t, 'A'); drawA(t); drawB(t); drawEmitters(t, 'B'); drawC(t);
  if (t < 7.55) drawDot(t); else drawObject(t);
  drawEmitters(t, 'C');
  vignetteLight();
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  if (t < 14.0) { sceneABC(t); drawHUD(t, false); }
  else if (t < 15.75) drawBurst(t);
  else if (t < 16.5) { drawDropIn(t); }
  else if (t < 28.0) { world3D(t); drawHUD(t, true); }
  else if (typeof drawEnding === 'function') drawEnding(t);
  else { ctx.fillStyle = '#141413'; ctx.fillRect(0, 0, W, H); }
}

// ===== 90-post.js =====
// =====================================================================================================
//  Frame composition + post: motion blur, camera shake, bloom, chromatic aberration, grain.
// =====================================================================================================
const IMPACTS = [[16.0, 14], [28.0, 10], [36.0, 22]];    // [time, shake in px]
function shake(t) {
  let dx = 0, dy = 0;
  for (const [b, a] of IMPACTS) if (t >= b && t < b + .7) { const e = a * Math.exp(-(t - b) / .1); dx += e * Math.sin(TAU * 23 * (t - b)); dy += e * Math.cos(TAU * 17 * (t - b) + 1); }
  for (const w of BURST_T) if (t >= w && t < w + .2) { const e = 4 * Math.exp(-(t - w) / .05); dx += e * Math.sin(TAU * 29 * (t - w)); dy += e * Math.cos(TAU * 31 * (t - w)); }
  return { dx, dy };
}
const bloomAmt = t => .5 * seg(t, 16.05, 16.5) * (1 - seg(t, 27.8, 28.0)) + .3 * ss(seg(t, 28, 29)) * (1 - seg(t, 35.9, 36.0)) + .4 * ss(seg(t, 36, 36.3)) * (1 - ss(seg(t, 36.4, 38.5))) + .07 * ss(seg(t, 38.5, 39));
function caAmt(t) {
  let a = pulse(t, 16.0, .011, .2) + pulse(t, 28.0, .009, .2) + pulse(t, 36.0, .016, .25);
  for (const w of BURST_T) a += pulse(t, w, .005, .07);
  return a;
}
const BA = mk(480, 270), bax = BA.g, BB = mk(480, 270), bbx = BB.g;
function bloom(amt) {
  if (amt <= .001) return;
  bax.globalCompositeOperation = 'copy'; bax.drawImage(cv, 0, 0, 480, 270);
  bbx.globalCompositeOperation = 'copy'; bbx.filter = 'contrast(2.0) brightness(1.1) saturate(1.35) blur(7px)'; bbx.drawImage(BA.c, 0, 0); bbx.filter = 'none';
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'screen'; main.globalAlpha = amt;
  main.drawImage(BB.c, 0, 0, W, H); main.restore();
}
const CA1 = mk(W, H), ca1 = CA1.g, CA2 = mk(W, H), ca2 = CA2.g;
function chroma(a) {
  if (a < .0006) return;
  ca1.globalCompositeOperation = 'copy'; ca1.drawImage(cv, 0, 0);
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'copy'; main.fillStyle = '#000'; main.fillRect(0, 0, W, H);
  main.globalCompositeOperation = 'lighter';
  [[2, '#ff0000'], [1, '#00ff00'], [0, '#0000ff']].forEach(([m, col]) => {
    const s = 1 + a * m;
    ca2.setTransform(s, 0, 0, s, 960 * (1 - s), 540 * (1 - s)); ca2.globalCompositeOperation = 'copy'; ca2.drawImage(CA1.c, 0, 0);
    ca2.setTransform(1, 0, 0, 1, 0, 0); ca2.globalCompositeOperation = 'multiply'; ca2.fillStyle = col; ca2.fillRect(0, 0, W, H);
    main.drawImage(CA2.c, 0, 0);
  });
  main.restore();
}
const GR = [0, 1, 2].map(k => {
  const { c, g } = mk(256, 256), im = g.createImageData(256, 256), r = mulberry32(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 200; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
let GRP = null;
function grain(f) {
  if (!GRP) GRP = GR.map(c => main.createPattern(c, 'repeat'));
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalCompositeOperation = 'overlay'; main.globalAlpha = .07;
  main.translate(-((f * 53) % 256), -((f * 97) % 256));
  main.fillStyle = GRP[f % 3]; main.fillRect(0, 0, W + 256, H + 256);
  main.restore();
}
function composite(ts, alpha) {
  const { dx, dy } = shake(ts), s = 1 + Math.max(Math.abs(dx) / 960, Math.abs(dy) / 540);
  main.globalAlpha = alpha; main.globalCompositeOperation = 'source-over';
  main.setTransform(s, 0, 0, s, 960 * (1 - s) + dx, 540 * (1 - s) + dy);
  main.drawImage(scr, 0, 0);
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1;
}
function post(t, f) { bloom(bloomAmt(t)); chroma(caAmt(t)); grain(f); }
// motion-blur budget: more sub-frames where things move fast
function subN(t) {
  for (const [a, b, n] of SUBS) if (t >= a && t < b) return n;
  return 4;
}
window.renderFrame = f => {
  CUR_F = f; const t0 = f / FPS, N = subN(t0);
  for (let i = 0; i < N; i++) {
    const ts = clamp(t0 + ((i + .5) / N - .5) * SHUTTER / FPS, 0, T - 1e-6);
    draw(ts); composite(ts, 1 / (i + 1));
  }
  post(t0, f);
  return N;
};
window.seek = t => { t = clamp(t, 0, T - 1e-6); CUR_F = Math.round(t * FPS); draw(t); composite(t, 1); post(t, CUR_F); };

// ------------------------------------------------------------------ preview player (not used while rendering)
let playing = false, tcur = 0, last = null;
const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tc = document.getElementById('tc'), au = document.getElementById('au');
let audioOk = false; au.addEventListener('canplay', () => { audioOk = true; }); au.addEventListener('error', () => { audioOk = false; });
function setPlay(v) {
  playing = v; pp.textContent = v ? '❚❚' : '▶';
  if (audioOk) { if (v) { au.currentTime = tcur; au.play().catch(() => {}); } else au.pause(); }
}
function tick(now) {
  if (playing) {
    if (audioOk && !au.paused) tcur = au.currentTime;
    else if (last !== null) tcur += (now - last) / 1000;
    if (tcur >= T) { tcur = 0; if (audioOk) { au.currentTime = 0; au.play().catch(() => {}); } }
  }
  last = now;
  window.seek(tcur);
  sc.value = Math.round(tcur * FPS); tc.textContent = tcur.toFixed(2) + ' s / ' + T + ' s';
  requestAnimationFrame(tick);
}
function jump(t) { tcur = clamp(t, 0, T - 1 / FPS); if (audioOk) au.currentTime = tcur; }
pp.onclick = () => setPlay(!playing);
sc.oninput = () => jump(sc.value / FPS);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight') jump(tcur + (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'ArrowLeft') jump(tcur - (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'KeyR') { jump(0); setPlay(true); }
});

// ===== 99-boot.js =====
// =====================================================================================================
//  Boot: load every font, compute the layouts, expose the sound cues, start the preview player.
// =====================================================================================================
(async () => {
  const faces = [SANS(100, 600), SANS(100, 450), SANS(100, 700), SANS(100, 800), SER(100), MONO(20), FRA(100), UNB(100), SYN(100), BRI(100), ANT(100), CAV(100)];
  await Promise.all(faces.map(f => document.fonts.load(f, 'BonjourÉé’²−0123456789')));
  await document.fonts.ready;
  initLayoutABC();
  if (typeof initLayoutD === 'function') initLayoutD();
  if (typeof initLayoutE === 'function') initLayoutE();
  if (typeof initLayoutFGH === 'function') initLayoutFGH();
  window.CUES = typeof buildCues === 'function' ? buildCues() : [];
  window.ready = true;
  if (!RENDER) { const q = new URLSearchParams(location.search).get('t'); if (q) tcur = +q; requestAnimationFrame(tick); }
})();

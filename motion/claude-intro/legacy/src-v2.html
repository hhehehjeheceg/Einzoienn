<script>
'use strict';
// ------------------------------------------------------------------ setup
const W = 1920, H = 1080, FPS = 60, T = 40, SHUTTER = 0.5;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c');
const main = cv.getContext('2d');
const scr = document.createElement('canvas'); scr.width = W; scr.height = H;
const sctx = scr.getContext('2d');
const ctx = sctx;   // every scene draws into the scratch canvas, then gets composited (blur, shake, bloom, chroma, grain)

// ------------------------------------------------------------------ math
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const ioq = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const out = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const o5 = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 5);
const inn = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
// closed-form spring step response (stiffness k, damping ratio z, unit mass)
function spring(t, k = 170, z = .8) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k);
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pulse = (t, b, a, tau = .16) => t < b ? 0 : a * (1 - Math.exp(-(t - b) / .025)) * Math.exp(-(t - b) / tau);

// ------------------------------------------------------------------ palette & type
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const P = {
  cream: hex('#f0eee6'), ink: hex('#141413'), clay: hex('#d97757'), paper: hex('#faf9f5'),
  mute: hex('#87847b'), line: hex('#d6d2c6'), card: hex('#22211e'),
  bubble: hex('#34322e'), sand: hex('#cdbb9f'), warm: hex('#ead2bd'), dim: hex('#77746c'), chrome: hex('#4a4843'),
};
const rgb = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, a)})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const SANS = (s, w = 600) => `${w} ${s}px InterV, Inter, "IPAGothic", sans-serif`;
const SER = s => `italic 400 ${s}px InstrSerif, serif`;
const MONO = s => `500 ${s}px JBM, "DejaVu Sans Mono", monospace`;

const mcache = new Map();
const meas = document.createElement('canvas').getContext('2d');
function tw(s, font, ls = 0) {
  const k = font + '|' + ls + '|' + s;
  let v = mcache.get(k);
  if (v === undefined) { meas.font = font; meas.letterSpacing = ls + 'px'; v = meas.measureText(s).width; mcache.set(k, v); }
  return v;
}
function txt(s, x, y, font, col, o = {}) {
  ctx.font = font; ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.textAlign = o.align || 'left';
  ctx.fillStyle = typeof col === 'string' ? col : rgb(col, o.alpha === undefined ? 1 : o.alpha);
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
// masked rise: a word rises into its own line box (pin 0..1) and leaves through the top (pout 0..1)
function rise(s, x, y, font, col, pin, pout, o = {}) {
  if (pin <= 0.0005 || pout >= 0.9995) return;
  const lh = o.lh || 100, ls = o.ls || 0, rot = o.rot === undefined ? .06 : o.rot;
  const w = tw(s, font, ls);
  ctx.save();
  ctx.beginPath(); ctx.rect(x - lh * .45, y - lh * 1.02, w + lh * .9, lh * 1.36); ctx.clip();
  ctx.translate(x, y + (1 - pin) * lh * 1.12 - pout * lh * 1.4);
  ctx.rotate((1 - pin) * rot - pout * rot * .5);
  txt(s, 0, 0, font, col, { ls, alpha: o.alpha });
  ctx.restore();
}
// a diagonal light sweep clipped to the shape of a word (drawn on top of the word)
const SH = document.createElement('canvas'); SH.width = 1500; SH.height = 460;
const shx = SH.getContext('2d');
function sheen(s, x, y, font, ls, p, col = P.clay, a = .95) {
  if (p <= 0 || p >= 1) return;
  shx.setTransform(1, 0, 0, 1, 0, 0); shx.globalCompositeOperation = 'source-over'; shx.clearRect(0, 0, 1500, 460);
  shx.font = font; shx.letterSpacing = ls + 'px'; shx.textAlign = 'left'; shx.fillStyle = '#000'; shx.fillText(s, 60, 330);
  shx.globalCompositeOperation = 'source-in';
  const w = tw(s, font, ls), cx = 60 - 300 + (w + 700) * p;
  const g = shx.createLinearGradient(cx - 130, 0, cx + 130, 0);
  g.addColorStop(0, rgb(col, 0)); g.addColorStop(.5, rgb(col, a)); g.addColorStop(1, rgb(col, 0));
  shx.setTransform(1, 0, -.42, 1, 0, 0); shx.fillStyle = g; shx.fillRect(-400, 0, 2300, 460);
  ctx.drawImage(SH, x - 60, y - 330);
}

// ------------------------------------------------------------------ timeline constants (120 BPM: beat .5 s, bar 2 s)
// A 0-4 "Bonjour."   B 4-7.6 "Je suis Claude."   C 7.6-14 verbs   D 14-16 word burst   E 16-28 3D world (drop)
// F 28-33.3 "Je vérifie / je ne sais pas"   G 33.3-36 orbit recap   H 36-40 logo (second drop)
const TT = [1.0, 1.1, 1.19, 1.31, 1.4, 1.5, 1.62], PT = 2.0;
const B = { size: 200, ls: -9, y: 612 };
const VT = [8.0, 9.5, 11.0, 12.5];
const PH = ['Je lis.', 'J’écris.', 'Je code.', 'Je raisonne.'];
const OC = { x: 1340, y: 540 };
const BW = [
  [14.0, 'Résumer', 'ink', 0], [14.25, 'Traduire', 'cream', 1], [14.5, 'Expliquer', 'clay', 0], [14.75, 'Rédiger', 'ink', 1],
  [15.0, 'Calculer', 'cream', 2], [15.125, 'Planifier', 'ink', 0], [15.25, 'Corriger', 'clay', 1], [15.375, 'Imaginer', 'cream', 0],
  [15.5, 'Analyser', 'ink', 1], [15.625, 'Créer', 'clay', 0],
];
const CW = 780, CH = 480, FOC = 1100, DF = FOC / 1.3, ZDOT = 12200, FLOOR = 520;
const CARDS = [
  { x: -430, y: -40, z: 1500, kind: 'chat', title: 'Discuter', tag: 'ILLUSTRATION' },
  { x: 440, y: 50, z: 3000, kind: 'term', title: 'Coder', tag: 'ILLUSTRATION' },
  { x: -400, y: 10, z: 4500, kind: 'chart', title: 'Analyser', tag: 'DONNÉES D’EXEMPLE' },
  { x: 430, y: -50, z: 6000, kind: 'vision', title: 'Voir', tag: 'ILLUSTRATION' },
  { x: -420, y: 30, z: 7500, kind: 'math', title: 'Calculer', tag: 'EXEMPLE' },
  { x: 420, y: -30, z: 9000, kind: 'lang', title: 'Traduire', tag: 'ILLUSTRATION' },
];
const ARR = [17.5, 19.25, 21.0, 22.75, 24.5, 26.25], LEAVE = [18.75, 20.5, 22.25, 24.0, 25.75, 27.2];
const LANGS = ['Hello', 'Hola', 'Ciao', 'Привет', 'Olá', 'Γεια σου', 'Hallo', 'こんにちは', 'Bonjour'];
const LANG_T = [ARR[5] - .18]; [0.075, 0.075, 0.08, 0.09, 0.1, 0.11, 0.13, 0.16].forEach(d => LANG_T.push(LANG_T[LANG_T.length - 1] + d));
const BARS = [42, 55, 49, 68, 74, 91];
const CODE = [
  [['function', 'kw'], [' ', 'p'], ['saluer', 'fn'], ['(', 'p'], ['nom', 'var'], [') {', 'p']],
  [['  return ', 'kw'], ['`Bonjour, ${', 'str'], ['nom', 'var'], ['} !`', 'str'], [';', 'p']],
  [['}', 'p']],
  [],
  [['saluer', 'fn'], ['(', 'p'], ['"monde"', 'str'], [');', 'p']],
  [['// "Bonjour, monde !"', 'cm']],
];
const CODE_COL = { kw: P.clay, fn: P.cream, var: P.warm, str: P.sand, p: hex('#8b887f'), cm: P.dim };
const ORB = ['Discuter', 'Coder', 'Analyser', 'Voir', 'Calculer', 'Traduire'];
const GLYPHS = '{}()<>/;=+*#@&%?!λπ∑∫√é§01';

// ------------------------------------------------------------------ layout (after fonts load)
const L = {};
function initLayout() {
  // A
  const bf = SANS(B.size, 600);
  L.b = { font: bf, pre: [], adv: [] };
  for (let i = 0; i <= 7; i++) L.b.pre.push(i ? tw('Bonjour'.slice(0, i), bf, B.ls) : 0);
  for (let i = 0; i < 7; i++) L.b.adv.push(L.b.pre[i + 1] - L.b.pre[i]);
  L.b.wv = L.b.pre[7] - B.ls; L.b.pw = 46;
  const lx = 960 - (L.b.pre[7] + L.b.pw) / 2;
  L.P1 = { x: lx + L.b.wv + 10 + 18, y: B.y - 18 };
  L.lbl = '// 01 · PRÉSENTATION'; L.lblW = tw(L.lbl, MONO(22), 3);
  // B
  const s2 = L.s2 = { fa: SANS(150, 600), lsa: -6, fb: SER(244), lsb: -2, y: 618 };
  const wa = tw('Je suis', s2.fa, s2.lsa) - s2.lsa, wb = tw('Claude', s2.fb, s2.lsb) - s2.lsb;
  const total = wa + 46 + wb + 14 + 34;
  s2.x0 = 960 - total / 2; s2.xJe = s2.x0; s2.xSuis = s2.x0 + tw('Je ', s2.fa, s2.lsa);
  s2.xC = s2.x0 + wa + 46; s2.wC = wb; s2.preC = [];
  for (let k = 0; k < 6; k++) s2.preC.push(k ? tw('Claude'.slice(0, k), s2.fb, s2.lsb) : 0);
  L.P2 = { x: s2.xC + wb + 14 + 17, y: s2.y - 17 };
  s2.sub = 'Une IA conçue par Anthropic'; s2.fs = SANS(40, 500); s2.wSub = tw(s2.sub, s2.fs, -.5);
  // C
  L.ph = { font: SANS(124, 600) };
  const r = mulberry32(11);
  L.page = { lis: [], ecr: [] };
  for (let j = 0; j < 9; j++) L.page.lis.push(j === 8 ? 150 : 236 + r() * 76);
  for (let j = 0; j < 7; j++) L.page.ecr.push(j === 6 ? 130 : 220 + r() * 92);
  L.code = CODE.map(line => { let x = 0; const parts = line.map(([s, k]) => { const o = { s, k, x }; x += tw(s, MONO(24)); return o; }); return { parts, w: x }; });
  L.codeT = []; { let t0 = 11.28; L.code.forEach(l => { L.codeT.push(l.w ? t0 : -1); if (l.w) t0 += .13; }); }
  // fibonacci sphere + 3 nearest neighbours
  const NS = 46; L.sph = [];
  for (let i = 0; i < NS; i++) { const y = 1 - 2 * (i + .5) / NS, rad = Math.sqrt(1 - y * y), th = i * 2.399963; L.sph.push({ x: Math.cos(th) * rad, y, z: Math.sin(th) * rad }); }
  const es = new Set(); L.sphE = [];
  L.sph.forEach((p, i) => {
    const d = L.sph.map((q, j) => [j, (p.x - q.x) ** 2 + (p.y - q.y) ** 2 + (p.z - q.z) ** 2]).filter(a => a[0] !== i).sort((a, b) => a[1] - b[1]);
    for (let n = 0; n < 3; n++) { const j = d[n][0], key = Math.min(i, j) + '-' + Math.max(i, j); if (!es.has(key)) { es.add(key); L.sphE.push([Math.min(i, j), Math.max(i, j)]); } }
  });
  // E
  L.chat = { q: 'Explique-moi les trous noirs simplement.', qf: SANS(25, 500) };
  L.chat.qw = tw(L.chat.q, L.chat.qf);
  const af = SANS(25, 450), ans = 'Imagine un endroit où la gravité est si forte que même la lumière ne peut pas s’en échapper. C’est ça, un trou noir.'.split(' ');
  L.chat.af = af; L.chat.words = [];
  let x = 0, line = 0; const sp = tw(' ', af);
  for (const w of ans) { const ww = tw(w, af); if (x + ww > 600 && x > 0) { x = 0; line++; } L.chat.words.push({ s: w, x, line }); x += ww + sp; }
  const cf = SANS(29, 500), cap = 'Un coucher de soleil sur un lac de montagne.'.split(' ');
  L.vis = { f: cf, words: [] }; x = 0; line = 0; const sp2 = tw(' ', cf);
  for (const w of cap) { const ww = tw(w, cf); if (x + ww > 300 && x > 0) { x = 0; line++; } L.vis.words.push({ s: w, x, line }); x += ww + sp2; }
  L.math = { f: SANS(54, 500), fb: SANS(54, 600) }; L.math.w3 = tw('x = 2  ou  x = 3', L.math.fb, -1);
  const rg = mulberry32(5); L.ghosts = [];
  while (L.ghosts.length < 30) {
    const g = { x: -2100 + rg() * 4200, y: -1150 + rg() * 2000, z: 300 + rg() * 12600, w: 280 + rg() * 380 };
    g.h = g.w * (.56 + rg() * .14); g.l = [.4 + rg() * .5, .3 + rg() * .5, .5 + rg() * .4];
    if (Math.abs(g.x) < 780 && Math.abs(g.y) < 580) continue;
    L.ghosts.push(g);
  }
  const rq = mulberry32(23); L.glyphs = [];
  while (L.glyphs.length < 120) {
    const g = { x: -2300 + rq() * 4600, y: -1300 + rq() * 2300, z: 150 + rq() * 13200, ch: GLYPHS[Math.floor(rq() * GLYPHS.length)], s: 40 + rq() * 80, r: (rq() - .5) * .8, v: (rq() - .5) * .5, c: rq() < .18 };
    if (Math.abs(g.x) < 1050 && Math.abs(g.y) < 470) continue;   // keep the camera corridor clear
    L.glyphs.push(g);
  }
  L.lang = { f: SANS(104, 600) }; L.lang.wB = tw('Bonjour', L.lang.f, -3) + 3;
  // F
  const s6 = L.s6 = { f1: SANS(112, 600), ls1: -4.5, y1: 600, f3: SER(178), y2: 500, y3: 676 };
  const placeWords = (str, font, ls, cx, extra) => {
    const wv = tw(str, font, ls) - ls, x0 = cx - (wv + extra) / 2, words = [];
    let pos = 0; for (const w of str.split(' ')) { words.push({ s: w, x: x0 + tw(str.slice(0, pos), font, ls), w: tw(w, font, ls) - ls }); pos += w.length + 1; }
    return { words, x0, wv };
  };
  const a1 = placeWords('Je vérifie mon travail', s6.f1, s6.ls1, 960, 12 + 30);
  s6.w1 = a1.words; L.P6a = { x: a1.x0 + a1.wv + 12 + 15, y: s6.y1 - 15 };
  s6.w2 = placeWords('Et je dis quand', s6.f1, s6.ls1, 960, 0).words;
  const a3 = placeWords('je ne sais pas', s6.f3, -1, 960, 10 + 30);
  s6.w3 = a3.words; s6.x3 = a3.x0; s6.wv3 = a3.wv; L.P6b = { x: a3.x0 + a3.wv + 10 + 15, y: s6.y3 - 15 };
  // G
  L.orb = ORB.map(s => ({ s, w: tw(s, SANS(44, 600), -1) }));
  // H
  const s7 = L.s7 = { f: SER(232), y: 604, ft: SANS(46, 500), ty: 742, tag: 'On construit quoi ?' };
  s7.wC = tw('Claude', s7.f, -2) + 2; s7.wTag = tw(s7.tag, s7.ft, -1) + 1;
  const gw = 92 + 34 + s7.wC, gx = 960 - gw / 2;
  L.P7 = { x: gx + 46, y: s7.y - 64 }; s7.xC = gx + 92 + 34;
  // grid ripples (scene space, before the camera)
  L.rip = [];
  TT.forEach(t => { const c = caretState(t + .001); L.rip.push({ t, x: c.x, y: c.y, a: 5 }); });
  L.rip.push({ t: PT, x: L.P1.x, y: L.P1.y, a: 14 }, { t: 4.16, x: s2.xC + wb / 2, y: s2.y - 80, a: 15 });
  VT.forEach(t => L.rip.push({ t, x: OC.x, y: OC.y, a: 11 }));
  L.rip.push({ t: 15.75, x: 960, y: 540, a: -18 }, { t: 28.0, x: 960, y: 540, a: 26 },
    { t: 29.0, x: s6.w1[1].x + s6.w1[1].w / 2, y: s6.y1 - 40, a: 9 }, { t: 30.82, x: 960, y: s6.y3 - 50, a: 10 },
    { t: 36.0, x: 960, y: 540, a: 38 }, { t: 36.38, x: L.P7.x, y: L.P7.y, a: 12 });
}

// ------------------------------------------------------------------ cues for the sound design
function buildCues() {
  const c = [], add = (t, k, o = {}) => c.push(Object.assign({ t: +t.toFixed(4), k, i: 0 }, o));
  add(.1, 'blip');
  TT.forEach((t, i) => add(t, 'key', { i }));
  add(PT, 'pop');
  for (let i = 0; i < L.lbl.length; i += 2) if (L.lbl[i] !== ' ') add(2.3 + i * .45 / L.lbl.length, 'tick', { i, soft: 1 });
  add(3.42, 'swoosh');
  add(4.0, 'rise'); add(4.16, 'bell', { i: 0 });
  add(5.0, 'swish'); add(5.15, 'shimmer', { i: 0, soft: 1 }); add(5.75, 'rise', { i: 1 });
  add(7.3, 'swoosh', { i: 1 });
  VT.forEach((t, i) => add(t, 'tok', { i }));
  add(8.5, 'scan', { d: .88 });
  for (let j = 0; j < 7; j++) add(9.86 + .145 * j, 'scribble', { i: j, d: L.page.ecr[j] / 1800 });
  L.codeT.forEach((t, i) => { if (t > 0) add(t, 'type', { i, d: .16 }); });
  for (let i = 0; i < 8; i++) add(12.62 + .06 * i, 'pop', { i: i % 6, soft: 1 });
  add(13.62, 'suck', { d: .34 });
  BW.forEach((w, i) => add(w[0], 'hit', { i }));
  add(15.75, 'suck', { i: 1, d: .2 });
  add(16.0, 'impact', { i: 0 }); add(16.05, 'dive', { d: 1.45 });
  const A = ARR;
  add(A[0] - .5, 'pop', { i: 3 }); add(A[0] - .12, 'pop', { i: 5, soft: 1 });
  for (let i = 0; i < 8; i++) add(A[1] - .42 + .04 * i, 'key', { i: i + 7 });
  for (let i = 0; i < 3; i++) add(A[1] + .02 + .15 * i, 'tick', { i: i + 3 });
  add(A[1] + .55, 'chime', { i: 0 });
  for (let i = 0; i < 6; i++) add(A[2] - .4 + .05 * i, 'pop', { i: i + 1, soft: 1 });
  add(A[2], 'swish', { i: 1 }); add(A[2] + .48, 'tick', { i: 6 });
  add(A[3] - .38, 'scan', { d: .63 }); for (let i = 0; i < 3; i++) add(A[3] + .2 + .1 * i, 'tick', { i: 2 + i });
  add(A[4] - .38, 'tok', { i: 0 }); add(A[4] + .15, 'tok', { i: 1 }); add(A[4] + .55, 'tok', { i: 3 }); add(A[4] + .72, 'chime', { i: 1 });
  LANG_T.forEach((t, i) => add(t, 'tick', { i: 7 + i }));
  add(LANG_T[8] + .02, 'chime', { i: 2 });
  for (let k = 0; k < 5; k++) add(LEAVE[k], 'whoosh', { i: k, d: ARR[k + 1] - LEAVE[k], pan: Math.sign(CARDS[k + 1].x - CARDS[k].x) });
  add(LEAVE[5], 'riser', { d: 28.0 - LEAVE[5] });
  add(28.0, 'impact', { i: 1 });
  add(28.22, 'rise', { i: 2 }); add(29.0, 'marker', { d: .38 }); add(30.3, 'swoosh', { i: 2 });

    txt(p.o.s, -p.o.w / 2, 0, SANS(44, 600), P.ink, { ls: -1, alpha: (.3 + .7 * p.dep) * clamp(e * 1.5) * (1 - col * col) });
    ctx.restore();
  });
}
function drawFinal(t, d) {
  const g = L.s7;
  [36.0, 36.13].forEach((b, j) => {
    const rp = seg(t, b, b + 1.05);
    if (rp > 0 && rp < 1) { circ(960, 540, 24 + (j ? 640 : 980) * o5(rp)); ctx.strokeStyle = rgb(P.clay, (j ? .3 : .5) * (1 - rp)); ctx.lineWidth = 1 + 4 * (1 - rp); ctx.stroke(); }
  });
  const u = seg(t, 36.0, 36.75);
  if (u > 0 && u < 1) {
    ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12 + TAU / 24, r2 = 70 + (i % 2 ? 420 : 560) * o5(seg(t, 36.0, 36.5)), r1 = 70 + (i % 2 ? 330 : 440) * o5(seg(t, 36.06, 36.75));
      if (r2 <= r1) continue;
      ctx.strokeStyle = rgb(P.clay, 1 - u * u); ctx.lineWidth = 2 + 5 * (1 - u);
      ctx.beginPath(); ctx.moveTo(960 + Math.cos(a) * r1, 540 + Math.sin(a) * r1); ctx.lineTo(960 + Math.cos(a) * r2, 540 + Math.sin(a) * r2); ctx.stroke();
    }
  }
  const rv = o5(seg(t, 36.38, 37.0));
  if (rv > 0) {
    ctx.save(); const xl = d.x + d.r + 2;
    ctx.beginPath(); ctx.rect(xl, g.y - 250, 2000, 340); ctx.clip();
    txt('Claude', g.xC - 90 * (1 - rv), g.y, g.f, P.ink, { ls: -2, alpha: clamp(rv * 1.5) });
    ctx.restore();
    sheen('Claude', g.xC, g.y, g.f, -2, io(seg(t, 37.1, 37.85)));
  }
  rise(g.tag, 960 - g.wTag / 2, g.ty, g.ft, P.ink, spring(t - 37.15, 170, .8), 0, { ls: -1, lh: 52, rot: .02, alpha: .72 });
  if (t > 37.55) {
    const ph = (t - 37.55) % 1, a = ph < .5 ? 1 - ss(seg(ph, .44, .5)) : ss(seg(ph, .94, 1));
    ctx.globalAlpha = a * seg(t, 37.55, 37.6);
    rr(960 + g.wTag / 2 + 12, g.ty - 40, 4, 50, 2); ctx.fillStyle = rgb(P.clay); ctx.fill(); ctx.globalAlpha = 1;
  }
}

// ------------------------------------------------------------------ frame composition
const RF = Math.hypot(960, 540) * 1.06;
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowColor = 'rgba(0,0,0,0)';
  if (t < 14.0) {
    bgCream(t, camZ(t));
    drawS1(t); drawS2(t); drawS3(t);
    if (t < 7.55) drawDot(t); else drawObject(t);
    vignette(false);
  } else if (t < 15.75) {
    drawBurst(t);
  } else if (t < 16.46) {
    bgCream(t, 1);
    const r = t < 15.92 ? lerp(120, 9, inn(seg(t, 15.75, 15.92))) : 9;
    circ(960, 540, r); ctx.fillStyle = rgb(P.clay); ctx.fill();
    vignette(false);
    if (t >= 16.0) {
      circ(960, 540, lerp(9, RF, o5(seg(t, 16.0, 16.32)))); ctx.fillStyle = rgb(P.clay); ctx.fill();
      const ri = RF * o5(seg(t, 16.1, 16.46));
      if (ri > 0) { ctx.save(); circ(960, 540, ri); ctx.clip(); world3D(t); ctx.restore(); }
    }
  } else if (t < 28.0) {
    world3D(t);
  } else {
    bgCream(t, camZ(t));
    drawS6(t);
    const d = dotB(t);
    if (t >= 33.3 && t < 36.0) orbitWords(t, d, false);
    if (t >= 35.98) drawFinal(t, d);
    circ(d.x, d.y, d.r); ctx.fillStyle = rgb(P.clay); ctx.fill();
    if (t >= 33.3 && t < 36.0) orbitWords(t, d, true);
    vignette(false);
    if (t < 28.36) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const Rh = lerp(17.5, RF, o5(seg(t, 28.0, 28.36)));
      ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(960, 540, Rh, 0, TAU, true);
      ctx.fillStyle = rgb(P.clay); ctx.fill('evenodd');
    }
  }
}

// ------------------------------------------------------------------ post: shake, bloom, chromatic aberration, grain
const IMPACTS = [[16.0, 14], [28.0, 10], [36.0, 20]];
function shake(t) {
  let dx = 0, dy = 0;
  for (const [b, a] of IMPACTS) if (t >= b && t < b + .7) { const e = a * Math.exp(-(t - b) / .1); dx += e * Math.sin(TAU * 23 * (t - b)); dy += e * Math.cos(TAU * 17 * (t - b) + 1); }
  for (const w of BW) if (t >= w[0] && t < w[0] + .2) { const e = 3 * Math.exp(-(t - w[0]) / .05); dx += e * Math.sin(TAU * 29 * (t - w[0])); }
  return { dx, dy };
}
const bloomAmt = t => .55 * seg(t, 16.05, 16.5) * (1 - seg(t, 27.8, 28.0));
function caAmt(t) {
  let a = pulse(t, 16.0, .011, .2) + pulse(t, 28.0, .009, .2) + pulse(t, 36.0, .014, .25);
  for (const w of BW) a += pulse(t, w[0], .004, .07);
  return a;
}
const BA = document.createElement('canvas'); BA.width = 480; BA.height = 270; const bax = BA.getContext('2d');
const BB = document.createElement('canvas'); BB.width = 480; BB.height = 270; const bbx = BB.getContext('2d');
function bloom(amt) {
  if (amt <= .001) return;
  bax.globalCompositeOperation = 'copy'; bax.drawImage(cv, 0, 0, 480, 270);
  bbx.globalCompositeOperation = 'copy'; bbx.filter = 'contrast(2.1) brightness(1.15) saturate(1.3) blur(7px)'; bbx.drawImage(BA, 0, 0); bbx.filter = 'none';
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'screen'; main.globalAlpha = amt;
  main.drawImage(BB, 0, 0, W, H); main.restore();
}
const CA1 = document.createElement('canvas'); CA1.width = W; CA1.height = H; const ca1 = CA1.getContext('2d');
const CA2 = document.createElement('canvas'); CA2.width = W; CA2.height = H; const ca2 = CA2.getContext('2d');
function chroma(a) {
  if (a < .0006) return;
  ca1.globalCompositeOperation = 'copy'; ca1.drawImage(cv, 0, 0);
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'copy'; main.fillStyle = '#000'; main.fillRect(0, 0, W, H);
  main.globalCompositeOperation = 'lighter';
  [[2, '#ff0000'], [1, '#00ff00'], [0, '#0000ff']].forEach(([m, col]) => {
    const s = 1 + a * m;
    ca2.setTransform(s, 0, 0, s, 960 * (1 - s), 540 * (1 - s)); ca2.globalCompositeOperation = 'copy'; ca2.drawImage(CA1, 0, 0);
    ca2.setTransform(1, 0, 0, 1, 0, 0); ca2.globalCompositeOperation = 'multiply'; ca2.fillStyle = col; ca2.fillRect(0, 0, W, H);
    main.drawImage(CA2, 0, 0);
  });
  main.restore();
}
const GR = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry32(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 200; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
let GRP = null;
function grain(f) {
  if (!GRP) GRP = GR.map(c => main.createPattern(c, 'repeat'));
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalCompositeOperation = 'overlay'; main.globalAlpha = .07;
  main.translate(-((f * 53) % 256), -((f * 97) % 256));
  main.fillStyle = GRP[f % 3]; main.fillRect(0, 0, W + 256, H + 256);
  main.restore();
}
function composite(ts, alpha) {
  const { dx, dy } = shake(ts), s = 1 + Math.max(Math.abs(dx) / 960, Math.abs(dy) / 540);
  main.globalAlpha = alpha; main.globalCompositeOperation = 'source-over';
  main.setTransform(s, 0, 0, s, 960 * (1 - s) + dx, 540 * (1 - s) + dy);
  main.drawImage(scr, 0, 0);
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1;
}
function post(t, f) { bloom(bloomAmt(t)); chroma(caAmt(t)); grain(f); }
// motion blur budget: more sub-frames where things move fast
const TRAVEL = [[16.0, 17.3], [27.15, 28.05], [35.3, 36.1]];
for (let k = 0; k < 5; k++) TRAVEL.push([LEAVE[k] - .05, ARR[k + 1] + .05]);
const FAST = [[3.4, 3.95], [7.2, 7.95], [9.4, 9.55], [10.95, 11.5], [12.45, 12.95], [13.55, 14.0], [15.75, 16.0], [28.0, 28.75], [30.25, 30.95], [33.05, 33.7], [34.6, 35.3], [36.1, 36.8]];
function subN(t) {
  for (const [a, b] of TRAVEL) if (t >= a && t < b) return 24;
  for (const [a, b] of FAST) if (t >= a && t < b) return 12;
  if (t >= 14.0 && t < 15.75) return 8;
  return 4;
}
window.renderFrame = f => {
  const t0 = f / FPS, N = subN(t0);
  for (let i = 0; i < N; i++) {
    const ts = clamp(t0 + ((i + .5) / N - .5) * SHUTTER / FPS, 0, T - 1e-6);
    draw(ts); composite(ts, 1 / (i + 1));
  }
  post(t0, f);
  return N;
};
window.seek = t => { t = clamp(t, 0, T - 1e-6); draw(t); composite(t, 1); post(t, Math.round(t * FPS)); };

// ------------------------------------------------------------------ preview player
let playing = false, tcur = 0, last = null;
const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tc = document.getElementById('tc'), au = document.getElementById('au');
let audioOk = false; au.addEventListener('canplay', () => { audioOk = true; }); au.addEventListener('error', () => { audioOk = false; });
function setPlay(v) {
  playing = v; pp.textContent = v ? '❚❚' : '▶';
  if (audioOk) { if (v) { au.currentTime = tcur; au.play().catch(() => {}); } else au.pause(); }
}
function tick(now) {
  if (playing) {
    if (audioOk && !au.paused) tcur = au.currentTime;
    else if (last !== null) tcur += (now - last) / 1000;
    if (tcur >= T) { tcur = 0; if (audioOk) { au.currentTime = 0; au.play().catch(() => {}); } }
  }
  last = now;
  window.seek(tcur);
  sc.value = Math.round(tcur * FPS); tc.textContent = tcur.toFixed(2) + ' s / ' + T + ' s';
  requestAnimationFrame(tick);
}
function jump(t) { tcur = clamp(t, 0, T - 1 / FPS); if (audioOk) au.currentTime = tcur; }
pp.onclick = () => setPlay(!playing);
sc.oninput = () => jump(sc.value / FPS);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight') jump(tcur + (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'ArrowLeft') jump(tcur - (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'KeyR') { jump(0); setPlay(true); }
});

// ------------------------------------------------------------------ boot
(async () => {
  await Promise.all([SANS(100, 600), SANS(100, 450), SANS(100, 700), SER(100), MONO(20)].map(f => document.fonts.load(f, 'BonjourÉé’²−')));
  await document.fonts.ready;
  initLayout();
  window.CUES = buildCues();
  window.ready = true;
  if (!RENDER) { const q = new URLSearchParams(location.search).get('t'); if (q) tcur = +q; requestAnimationFrame(tick); }
})();

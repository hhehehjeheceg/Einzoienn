<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Clés Minutes, film</title>
<style>
/*FONTS*/
html,body{margin:0;height:100%;background:#050608;overflow:hidden;font-family:InterV,Inter,sans-serif}
#stage{position:absolute;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;width:100%;height:auto}
#hud{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;box-sizing:border-box;color:#c4c9d1;font-size:14px}
#hud button{background:#ffab1a;color:#07080b;border:0;border-radius:8px;width:44px;height:32px;font-size:15px;cursor:pointer}
#hud input{flex:1;accent-color:#ffab1a}
#hud span{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
body.render #hud{display:none}
body.render #stage{inset:0}
body.render canvas{width:1920px;height:1080px;max-width:none;max-height:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="hud"><button id="pp" title="Lecture / pause (Espace)">▶</button><input id="sc" type="range" min="0" max="1799" value="0"><span id="tc">0.00 s</span></div>
<audio id="au" src="auto-cles-minutes-audio.m4a" preload="auto"></audio>
<script>
'use strict';
// ------------------------------------------------------------------ setup
const W = 1920, H = 1080, FPS = 60, T = 30, SHUTTER = 0.5;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c');
const main = cv.getContext('2d');
const scr = document.createElement('canvas'); scr.width = W; scr.height = H;
const ctx = scr.getContext('2d');

// ------------------------------------------------------------------ math
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const ioq = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2;
const out = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const o5 = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 5);
const inn = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
function spring(t, k = 170, z = .8) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k);
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pulse = (t, b, a, tau = .16) => t < b ? 0 : a * (1 - Math.exp(-(t - b) / .025)) * Math.exp(-(t - b) / tau);
const frac = x => x - Math.floor(x);
const hash = (a, b = 0) => frac(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);

// ------------------------------------------------------------------ palette & type
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const P = {
  night: hex('#07080b'), coal: hex('#111318'), steel: hex('#2b2f36'), mute: hex('#7d838c'), silver: hex('#c4c9d1'),
  white: hex('#f4f5f7'), amber: hex('#ffab1a'), amberD: hex('#b85f00'), red: hex('#ff3b2f'), cool: hex('#dce6ff'),
};
const rgb = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, a)})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const SANS = (s, w = 700) => `${w} ${s}px InterV, Inter, sans-serif`;
const MONO = s => `500 ${s}px JBM, "DejaVu Sans Mono", monospace`;
const NB = ' ';   // narrow no-break space before ? and :

const mcache = new Map();
const meas = document.createElement('canvas').getContext('2d');
function tw(s, font, ls = 0) {
  const k = font + '|' + ls + '|' + s;
  let v = mcache.get(k);
  if (v === undefined) { meas.font = font; meas.letterSpacing = ls + 'px'; v = meas.measureText(s).width; mcache.set(k, v); }
  return v;
}
function txt(s, x, y, font, col, o = {}) {
  ctx.font = font; ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.textAlign = o.align || 'left';
  ctx.fillStyle = typeof col === 'string' ? col : rgb(col, o.alpha === undefined ? 1 : o.alpha);
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
const I = () => ctx.setTransform(1, 0, 0, 1, 0, 0);
// masked rise: a word rises into its own line box (pin 0..1) and leaves through the top (pout 0..1)
function rise(s, x, y, font, col, pin, pout, o = {}) {
  if (pin <= 0.0005 || pout >= 0.9995) return;
  const lh = o.lh || 100, ls = o.ls || 0, rot = o.rot === undefined ? .06 : o.rot;
  const w = tw(s, font, ls);
  ctx.save();
  ctx.beginPath(); ctx.rect(x - lh * .45, y - lh * 1.02, w + lh * .9, lh * 1.36); ctx.clip();
  ctx.translate(x, y + (1 - pin) * lh * 1.12 - pout * lh * 1.4);
  ctx.rotate((1 - pin) * rot - pout * rot * .5);
  txt(s, 0, 0, font, col, { ls, alpha: o.alpha });
  ctx.restore();
}
// a line of words, each rising on its own beat
function riseLine(words, x, y, font, ls, t, t0, step, tout, col, o = {}) {
  let cx = x;
  const sp = tw(' ', font, ls);
  words.forEach((w, i) => {
    const c = Array.isArray(w) ? w[1] : col, s = Array.isArray(w) ? w[0] : w;
    rise(s, cx, y, font, c, spring(t - t0 - i * step, 190, .82), tout ? ioq(seg(t, tout + i * .04, tout + i * .04 + .3)) : 0, Object.assign({ ls }, o));
    cx += tw(s, font, ls) + sp;
  });
}
// diagonal light sweep clipped to the shape of a word
const SH = document.createElement('canvas'); SH.width = 2000; SH.height = 460;
const shx = SH.getContext('2d');
function sheen(s, x, y, font, ls, p, col = P.white, a = .9) {
  if (p <= 0 || p >= 1) return;
  shx.setTransform(1, 0, 0, 1, 0, 0); shx.globalCompositeOperation = 'source-over'; shx.clearRect(0, 0, 2000, 460);
  shx.font = font; shx.letterSpacing = ls + 'px'; shx.textAlign = 'left'; shx.fillStyle = '#000'; shx.fillText(s, 60, 330);
  shx.globalCompositeOperation = 'source-in';
  const w = tw(s, font, ls), cx = 60 - 300 + (w + 700) * p;
  const g = shx.createLinearGradient(cx - 150, 0, cx + 150, 0);
  g.addColorStop(0, rgb(col, 0)); g.addColorStop(.5, rgb(col, a)); g.addColorStop(1, rgb(col, 0));
  shx.setTransform(1, 0, -.42, 1, 0, 0); shx.fillStyle = g; shx.fillRect(-400, 0, 2800, 460);
  ctx.drawImage(SH, x - 60, y - 330);
}
// anamorphic lens flare (screen space, additive)
function flare(x, y, a, col = P.amber, len = 900, core = 170, thick = 9) {
  if (a <= .003) return;
  ctx.save(); I(); ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(x, y, 0, x, y, core);
  g.addColorStop(0, rgb(mixc(col, P.white, .7), Math.min(1, a))); g.addColorStop(.22, rgb(col, a * .45)); g.addColorStop(1, rgb(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - core, y - core, 2 * core, 2 * core);
  ctx.translate(x, y); ctx.scale(len / 40, thick / 40);
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
  g.addColorStop(0, rgb(mixc(col, P.white, .5), Math.min(1, a * .8))); g.addColorStop(.4, rgb(col, a * .25)); g.addColorStop(1, rgb(col, 0));
  ctx.fillStyle = g; ctx.fillRect(-40, -40, 80, 80);
  ctx.restore();
}
function glow(x, y, r, col, a) {
  if (a <= .003) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgb(col, a)); g.addColorStop(1, rgb(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function starPath(cx, cy, R, r) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, q = k % 2 ? r : R; ctx.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  ctx.closePath();
}

// ------------------------------------------------------------------ timeline (120 BPM: beat .5 s, bar 2 s)
// S1 0-4 fob + "Clé perdue ?"   S2 4-7.65 blade cut (double)   S3 8-12 chip programming
// S4 12-16 brands + tach        S5 16-20 DROP wordmark + warp  S6 20-23 proof   S7 23-26 map   S8 26-30 lockup
const FOB = { x: 960, y: 540, w: 520, h: 240, r: 112 };
const PIV = { x: 1170, y: 470 };
const BL = 430, BH = 58;
const LED = { x: 768, y: 474 };
const BTN = [{ x: 838, y: 572 }, { x: 960, y: 572 }, { x: 1082, y: 572 }];
const FLIP = 3.45;
const BLANK_Y = 557;
const CUT0 = 4.45, CUT1 = 6.45, SCAN0 = 6.55, SCAN1 = 7.05;
const GCUTS = [0, .18, -.2, .06, .22, -.12, .17, -.05, 0];
const CH = { x: 1250, y: 540 };
const WORDS = [[12.0, 'PEUGEOT', 'amber'], [12.5, 'RENAULT', 'night'], [13.0, 'VOLKSWAGEN', 'white'], [13.5, 'MERCEDES', 'night'], [14.0, 'TOYOTA', 'amber'], [14.5, 'ET BIEN D’AUTRES', 'night']];
const ROUTE = [[-1920, 960], [-480, 960], [-480, 480], [0, 480], [0, 0]];
const PIN_T = 24.1;
const CHIPS = ['Prix annoncé avant l’intervention', 'Réalisé dans notre atelier', 'Devis en ligne'];
const CHIP_T = [21.0, 21.5, 22.0];
const URL_S = 'auto-cles-minutes.fr';

// ------------------------------------------------------------------ layout (after fonts load)
const L = {};
function gyU(u) {   // groove centre offset (in blade heights) along the blade, u 0..1
  const n = GCUTS.length - 1, x = clamp(u) * n, i = Math.min(n - 1, Math.floor(x)), f = x - i;
  return lerp(GCUTS[i], GCUTS[i + 1], (1 - Math.cos(Math.PI * f)) / 2);
}
function initLayout() {
  // S1 text
  L.f1 = SANS(112, 750); L.ls1 = -3.5;
  // S2 groove points (local blade coords)
  L.groove = []; for (let i = 0; i <= 80; i++) { const u = i / 80; L.groove.push([70 + u * (BL - 125), gyU(u) * BH]); }
  // dust
  const r = mulberry32(7); L.dust = [];
  for (let i = 0; i < 70; i++) L.dust.push({ x: r() * W, y: r() * H, z: .3 + r() * .7, r: 2 + r() * 7, ph: r() * 6 });
  // sparks (S2)
  const rs = mulberry32(31); L.sparks = [];
  for (let te = CUT0 + .02; te < CUT1; te += 1 / 260) {
    L.sparks.push({ te, a: -Math.PI * (.55 + rs() * .5), v: 120 + rs() * 260, life: .25 + rs() * .45, w: .6 + rs() * 1.1, hot: rs() });
  }
  // S3 traces
  const rt = mulberry32(19); L.tr = [];
  const sides = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  sides.forEach(([nx, ny], si) => {
    for (let k = -3; k <= 3; k++) {
      const off = k * 32;
      let x = CH.x + nx * 140 + (ny ? off : 0), y = CH.y + ny * 140 + (nx ? off : 0);
      const pts = [[x, y]];
      let l1 = 30 + rt() * 120; x += nx * l1; y += ny * l1; pts.push([x, y]);
      const turn = (rt() < .5 ? -1 : 1) * (Math.abs(k) >= 2 ? Math.sign(k || 1) : (rt() < .5 ? -1 : 1));
      const l2 = 40 + rt() * 140;
      x += nx * l2 + (nx ? 0 : turn * l2); y += ny * l2 + (ny ? 0 : turn * l2); pts.push([x, y]);
      let l3 = 120 + rt() * 900; if (nx < 0) l3 = Math.max(10, Math.min(l3, x - 1010)); x += nx * l3; y += ny * l3; pts.push([x, y]);
      if (nx >= 0 && rt() < .5) { const l4 = 60 + rt() * 200; x += (nx ? nx : turn) * l4 * (nx ? .7 : 1); y += (ny ? ny : turn) * l4 * (ny ? .7 : 1); pts.push([x, y]); }
      let len = 0; const cum = [0];
      for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(len); }
      L.tr.push({ pts, cum, len, si, k, pad: rt() < .7 });
    }
  });
  // S5 wordmark
  const wm = L.wm = { f: SANS(196, 800), ls1: -3, l1: 'AUTO\u2002CLÉS', l2: 'MINUTES', y1: 500, y2: 702 };
  wm.w1 = tw(wm.l1, wm.f, wm.ls1) - wm.ls1;
  const w2n = tw(wm.l2, wm.f, 0);
  wm.ls2 = (wm.w1 - w2n) / (wm.l2.length - 1);
  wm.x = 960 - wm.w1 / 2;
  wm.letters = [];
  [[wm.l1, wm.ls1, wm.y1, 0], [wm.l2, wm.ls2, wm.y2, 1]].forEach(([s, ls, y, line]) => {
    for (let i = 0; i < s.length; i++) {
      if (s[i] === ' ' || s[i] === '\u2002') continue;
      wm.letters.push({ ch: s[i], x: wm.x + (i ? tw(s.slice(0, i), wm.f, ls) : 0), w: tw(s[i], wm.f, 0), y, line });
    }
  });
  wm.sub = 'Double de clé voiture · Lille Métropole'; wm.fs = SANS(40, 500); wm.wsub = tw(wm.sub, wm.fs, 0);
  // warp streaks
  const rw = mulberry32(3); L.warp = [];
  for (let i = 0; i < 260; i++) L.warp.push({ a: rw() * TAU, ph: rw(), rate: .55 + rw() * .5, amber: rw() < .3, w: .6 + rw() * 1.4 });
  // S7 map
  const rm = mulberry32(41);
  L.xs = []; L.ys = [];
  for (let k = -16; k <= 16; k++) { L.xs.push(k * 160 + (k % 3 ? (rm() - .5) * 70 : 0)); L.ys.push(k * 160 + (k % 3 ? (rm() - .5) * 70 : 0)); }
  L.roads = { minor: [], major: [] };
  const onRoute = (x1, y1, x2, y2) => ROUTE.some((p, i) => i && Math.min(ROUTE[i - 1][0], p[0]) <= Math.min(x1, x2) && Math.max(ROUTE[i - 1][0], p[0]) >= Math.max(x1, x2) && Math.min(ROUTE[i - 1][1], p[1]) <= Math.min(y1, y2) && Math.max(ROUTE[i - 1][1], p[1]) >= Math.max(y1, y2));
  for (let i = 0; i < 33; i++) for (let j = 0; j < 32; j++) {
    const k = i - 16, maj = k % 3 === 0;
    let s = [L.xs[i], L.ys[j], L.xs[i], L.ys[j + 1]];
    if (maj || rm() < .82 || onRoute(...s)) L.roads[maj ? 'major' : 'minor'].push(s);
    s = [L.xs[j], L.ys[i], L.xs[j + 1], L.ys[i]];
    if (maj || rm() < .82 || onRoute(...s)) L.roads[maj ? 'major' : 'minor'].push(s);
  }
  L.roads.major.push([-1950, -1500, 1950, 1250], [-1600, 1900, 900, -1950]);
  L.lamps = [];
  for (let i = 0; i < 33; i++) for (let j = 0; j < 33; j++) if (rm() < .4) L.lamps.push([L.xs[i] + (rm() - .5) * 60, L.ys[j] + (rm() - .5) * 60, rm() * 6, .4 + rm() * .6]);
  L.routeLen = 0; L.routeCum = [0];
  for (let i = 1; i < ROUTE.length; i++) { L.routeLen += Math.hypot(ROUTE[i][0] - ROUTE[i - 1][0], ROUTE[i][1] - ROUTE[i - 1][1]); L.routeCum.push(L.routeLen); }
  // S8 lockup
  const lk = L.lk = { f: SANS(124, 800), ls1: -2, R: 96, y1: 502, y2: 632 };
  lk.w1 = tw(wm.l1, lk.f, lk.ls1) - lk.ls1;
  lk.ls2 = (lk.w1 - tw(wm.l2, lk.f, 0)) / (wm.l2.length - 1);
  const total = 2 * lk.R + 56 + lk.w1;
  lk.ix = 960 - total / 2 + lk.R; lk.iy = 520; lk.xt = lk.ix + lk.R + 56;
  lk.fu = SANS(46, 500); lk.wu = tw(URL_S, lk.fu, 0);
  lk.fc = SANS(38, 700); lk.cta = 'Devis en ligne'; lk.wc = tw(lk.cta, lk.fc, 0);
}

// ------------------------------------------------------------------ cues for the sound design
function buildCues() {
  const c = [], add = (t, k, o = {}) => c.push(Object.assign({ t: +t.toFixed(4), k, i: 0 }, o));
  add(.25, 'sweep', { d: 1.0 });
  add(1.0, 'click'); add(1.04, 'radio');
  add(1.5, 'chirp', { i: 0 }); add(1.75, 'chirp', { i: 1 });
  add(1.85, 'swoosh', { i: 0 });
  add(2.0, 'rise', { i: 0 }); add(2.5, 'rise', { i: 1 });
  add(3.25, 'swish', { i: 0 });
  add(FLIP, 'flip'); add(3.62, 'zoom', { d: .4 });
  add(4.15, 'slide', { d: .4 });
  for (let i = 0; i < 18; i += 2) add(4.3 + i * .02, 'tick', { i, soft: 1 });
  add(4.6, 'rise', { i: 2 });
  add(CUT0, 'grind', { d: CUT1 - CUT0 });
  add(CUT1, 'ding', { i: 0 });
  add(SCAN0, 'scan', { d: SCAN1 - SCAN0 });
  for (let k = 1; k < GCUTS.length - 1; k++) add(SCAN0 + (SCAN1 - SCAN0) * (k / (GCUTS.length - 1)), 'tick', { i: k + 3 });
  add(7.05, 'swoosh', { i: 1 }); add(7.25, 'whoosh', { d: .4, pan: -1 });
  add(7.65, 'dive', { d: .4 });
  add(8.0, 'impact', { i: 0 });
  add(8.4, 'rise', { i: 3 });
  for (let b = 8.5; b <= 11.01; b += .5) add(b, 'data', { i: Math.round(b * 2) });
  for (let p = 5; p < 100; p += 5) add(8.6 + 2.3 * pInv(p / 100), 'tick', { i: p / 5, soft: 1 });
  add(11.0, 'success');
  add(11.55, 'suck', { d: .4 });
  WORDS.forEach((w, i) => add(w[0], 'hit', { i }));
  add(15.0, 'rev', { d: .72 });
  add(15.72, 'suck', { i: 1, d: .2 });
  add(16.0, 'boom', { i: 0 }); add(16.02, 'warp', { d: 2.2 });
  for (let i = 0; i < 14; i += 1) add(16.0 + .028 * i, 'tick', { i, soft: 1 });
  add(16.9, 'shimmer', { i: 0 }); add(17.2, 'rise', { i: 4 });
  add(19.3, 'riser', { d: .7 });
  add(20.0, 'impact', { i: 1 });
  for (let k = 0; k < 5; k++) add(20.35 + .1 * k, 'pop', { i: k });
  for (let i = 0; i < 10; i++) add(20.1 + i * .09, 'tick', { i: i + 2, soft: 1 });
  CHIP_T.forEach((t, i) => add(t, 'chip', { i }));
  add(22.6, 'whoosh', { d: .45, pan: 1 });
  add(23.1, 'scan', { d: 1.05, i: 1 });
  add(PIN_T - .05, 'drop', { d: .2 }); add(PIN_T + .13, 'thud');
  add(24.4, 'pop', { i: 5 });
  add(25.25, 'dive', { d: .7 });
  add(26.0, 'boom', { i: 1 });
  add(26.45, 'key'); add(26.5, 'gauge', { d: .5 });
  add(26.55, 'swish', { i: 1 }); add(26.65, 'swish', { i: 2 });
  add(27.3, 'shimmer', { i: 1, soft: 1 });
  for (let i = 0; i < URL_S.length; i++) add(urlT(i), 'type', { i });
  add(28.05, 'pop', { i: 2 }); add(28.07, 'chime', { i: 0 });
  return c.sort((a, b) => a.t - b.t);
}
const urlT = i => 27.3 + i * .033 + (i > 9 ? .03 : 0);

// ------------------------------------------------------------------ backgrounds
function bgNight(t, k = 1) {
  I();
  ctx.fillStyle = rgb(P.night); ctx.fillRect(0, 0, W, H);
  const fx = 960 + 520 * Math.sin(t * .23 + 1), fy = 540 + 260 * Math.cos(t * .17);
  glow(fx, fy, 1000, P.amber, .055 * k);
  const hx = 960 - 480 * Math.sin(t * .13), hy = 540 - 220 * Math.sin(t * .19 + 2);
  glow(hx, hy, 900, P.cool, .04 * k);
}
function dust(t, a = 1) {
  I();
  for (const d of L.dust) {
    const x = ((d.x + t * 14 * d.z) % (W + 200) + W + 200) % (W + 200) - 100, y = d.y + Math.sin(t * .4 + d.ph) * 22 * d.z;
    glow(x, y, d.r * 3, mixc(P.amber, P.white, d.z), .07 * d.z * a);
  }
}

// ------------------------------------------------------------------ S7 map (3D projected)
function mapCam(t) {
  const enter = t < 23.4 ? 1 - o5(seg(t, 22.55, 23.4)) : 0;
  const dive = seg(t, 25.25, 25.98);
  const D = Math.exp(lerp(Math.log(3500), Math.log(2350), io(seg(t, 22.6, 25.2)))) * Math.exp(Math.log(60 / 2350) * Math.pow(dive, 2.2));

    D, F: 1050,
    phi: (lerp(48, 57, io(seg(t, 22.6, 25.2))) - 30 * io(dive)) * Math.PI / 180,
    psi: lerp(.42, -.12, io(seg(t, 22.6, 25.6))),
    oy: 60 + 1300 * enter,

function proj(c, x, y, h = 0) {
  const cp = Math.cos(c.psi), sp = Math.sin(c.psi);

    ctx.save(); ctx.translate(px, py + 190); ctx.scale(lerp(.6, 1, k), lerp(.6, 1, k)); ctx.translate(-px, -(py + 190)); ctx.globalAlpha = a;
    rr(px, py, 600, 200, 28); ctx.fillStyle = 'rgba(14,16,20,0.78)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = rgb(P.amber); ctx.fillRect(px, py + 30, 4, 140);
    txt('ROUBAIX', px + 40, py + 92, SANS(72, 800), P.white, { ls: -1 });
    txt('110 rue de l’Épeule', px + 42, py + 140, SANS(32, 500), P.silver);
    txt('LILLE MÉTROPOLE', px + 42, py + 176, MONO(18), P.amber, { ls: 3 });
    ctx.restore();
  }
  // the pin floods the screen
  if (t > 25.7 && L.pinScr) {
    const RF = Math.hypot(1920, 1080) * 1.1;
    circ(L.pinScr.x, L.pinScr.y, lerp(L.pinScr.R, RF, inn(seg(t, 25.7, 25.98)))); ctx.fillStyle = rgb(P.amber); ctx.fill();

}

// ------------------------------------------------------------------ S8 lockup
function keyGlyph(x, y, a, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(-30, 0, 24, 0, TAU); ctx.arc(-30, 0, 10, 0, TAU, true); ctx.fill('evenodd');
  ctx.fillRect(-8, -7, 66, 14);
  ctx.fillRect(34, 5, 9, 15); ctx.fillRect(48, 5, 9, 11);
  ctx.restore();
}
function finalScene(t) {
  bgNight(t, 1);
  warp(t, .22, 960, 540);
  const lk = L.lk, wm = L.wm;
  let z = 1 + .035 * io(seg(t, 26.3, 30)); z *= 1 + pulse(t, 26.0, .02, .25);
  for (let b = 27; b < 30; b += 1) z *= 1 + pulse(t, b, .004, .14);
  ctx.setTransform(z, 0, 0, z, 960 * (1 - z), 540 * (1 - z));
  // gauge ring around the icon
  for (let k = 0; k < 40; k++) {
    const a = -Math.PI / 2 + k * TAU / 40, tk = 26.5 + .5 * k / 40;
    const on = t > tk ? 1 : 0, e = on * (.35 + .65 * Math.exp(-(t - tk) / .3));
    const r0 = lk.R + 22, r1 = lk.R + (k % 5 ? 32 : 42);

  }
  // wordmark slides out from behind the icon
  const xl = lk.ix + lk.R + 20;
  ctx.save(); ctx.beginPath(); ctx.rect(xl, 300, 1500, 400); ctx.clip();
  const r1 = o5(seg(t, 26.55, 27.15)), r2 = o5(seg(t, 26.65, 27.25));
  txt(wm.l1, lk.xt - 160 * (1 - r1), lk.y1, lk.f, P.white, { ls: lk.ls1, alpha: clamp(r1 * 1.4) });
  txt(wm.l2, lk.xt - 160 * (1 - r2), lk.y2, lk.f, P.amber, { ls: lk.ls2, alpha: clamp(r2 * 1.4) });
  ctx.restore();
  sheen(wm.l1, lk.xt, lk.y1, lk.f, lk.ls1, io(seg(t, 27.3, 28.0)), P.white, .8);
  sheen(wm.l2, lk.xt, lk.y2, lk.f, lk.ls2, io(seg(t, 27.4, 28.1)), P.white, .8);
  // url typed
  const n = URL_S.split('').filter((_, i) => t >= urlT(i)).length;
  const ux = 960 - lk.wu / 2;
  txt(URL_S.slice(0, n), ux, 790, lk.fu, P.silver);
  if (t > 27.2) {
    const cx = ux + tw(URL_S.slice(0, n), lk.fu, 0) + 6, blink = n < URL_S.length ? 1 : (frac((t - 28) * 1.6) < .55 ? 1 : 0);
    ctx.fillStyle = rgb(P.amber, blink); ctx.fillRect(cx, 752, 4, 48);
  }
  // CTA
  if (t > 28.05) {
    const k = spring(t - 28.05, 300, .62), w = lk.wc + 150, h = 88, x = 960 - w / 2, y = 860;
    ctx.save(); ctx.translate(960, y + h / 2); ctx.scale(k, k); ctx.translate(-960, -(y + h / 2));
    ctx.globalCompositeOperation = 'lighter'; glow(960, y + h / 2, 300, P.amber, .18 + .08 * Math.sin((t - 28) * TAU)); ctx.globalCompositeOperation = 'source-over';
    rr(x, y, w, h, h / 2); ctx.fillStyle = rgb(P.amber); ctx.fill();
    const cg = ctx.createConicGradient(t * 3.2, 960, y + h / 2);
    cg.addColorStop(0, 'rgba(255,255,255,0)'); cg.addColorStop(.06, 'rgba(255,255,255,0.95)'); cg.addColorStop(.12, 'rgba(255,255,255,0)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
    rr(x - 2, y - 2, w + 4, h + 4, h / 2 + 2); ctx.strokeStyle = cg; ctx.lineWidth = 3; ctx.stroke();
    txt(lk.cta, x + 50, y + 58, lk.fc, P.night);
    const nud = 6 * Math.max(0, Math.sin(frac(t * 2) * Math.PI)) * seg(t, 28.6, 28.8);
    const ax = x + 50 + lk.wc + 26 + nud;
    ctx.strokeStyle = rgb(P.night); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ax, y + 44); ctx.lineTo(ax + 34, y + 44); ctx.moveTo(ax + 20, y + 30); ctx.lineTo(ax + 34, y + 44); ctx.lineTo(ax + 20, y + 58); ctx.stroke();
    ctx.restore();
  }

  const u = o5(seg(t, 26.0, 26.42));
  const RF = Math.hypot(1920, 1080) * 1.1;

  circ(cx, cy, R); ctx.fillStyle = rgb(P.amber); ctx.fill();

  }

  flare(lk.ix, lk.iy, pulse(t, 26.45, .9, .3), P.amber, 1400, 260, 12);
  flare(lerp(-200, 2100, io(seg(t, 28.9, 29.9))), 520, .35 * Math.sin(Math.PI * seg(t, 28.9, 29.9)), P.cool, 900, 120, 6);
  vignette(1);
}

// ------------------------------------------------------------------ frame composition
function draw(t) {
  I(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t < 8.0) world12(t);
  else if (t < 12.0) chipScene(t);
  else if (t < 16.0) brandScene(t);
  else if (t < 20.0) dropScene(t);
  else if (t < 22.95) proofScene(t);
  else if (t < 26.0) drawMap(t, false);
  else finalScene(t);
}

// ------------------------------------------------------------------ post: shake, bloom, chromatic aberration, grain
const IMPACTS = [[1.5, 4], [1.75, 4], [FLIP, 5], [8.0, 7], [11.0, 4], [16.0, 18], [20.0, 6], [PIN_T + .13, 7], [26.0, 14], [26.45, 4]];
WORDS.forEach(w => IMPACTS.push([w[0], 6]));
function shake(t) {
  let dx = 0, dy = 0;
  for (const [b, a] of IMPACTS) if (t >= b && t < b + .7) { const e = a * Math.exp(-(t - b) / .1); dx += e * Math.sin(TAU * 23 * (t - b)); dy += e * Math.cos(TAU * 17 * (t - b) + 1); }
  if (t > 15.0 && t < 15.78) { const e = 1.5 + 9 * seg(t, 15.0, 15.7); dx += e * Math.sin(TAU * 31 * t); dy += e * .7 * Math.cos(TAU * 27 * t + 2); }
  if (t > CUT0 && t < CUT1) { dx += .9 * Math.sin(TAU * 41 * t); dy += .7 * Math.cos(TAU * 37 * t); }
  return { dx, dy };
}
function bloomAmt(t) {
  if (t >= 12.0 && t < 15.0) return .08;
  let a = .32;
  if (t >= 16.0 && t < 20.0) a = .62;
  if (t >= 20.0 && t < 26.0) a = .42;
  if (t >= 26.0) a = .45;
  return a + pulse(t, 1.5, .25, .15) + pulse(t, 1.75, .25, .15) + pulse(t, 11.0, .3, .3);
}
function caAmt(t) {
  let a = pulse(t, 16.0, .016, .22) + pulse(t, 26.0, .013, .22) + pulse(t, 8.0, .008, .15) + pulse(t, 20.0, .006, .15)
    + pulse(t, 1.5, .004, .1) + pulse(t, 1.75, .004, .1) + pulse(t, 11.0, .005, .15) + pulse(t, PIN_T + .13, .004, .12);
  for (const w of WORDS) a += pulse(t, w[0], .006, .08);
  if (t > 15.0 && t < 15.78) a += .006 * seg(t, 15.0, 15.7);
  return a;
}
const BA = document.createElement('canvas'); BA.width = 480; BA.height = 270; const bax = BA.getContext('2d');
const BB = document.createElement('canvas'); BB.width = 480; BB.height = 270; const bbx = BB.getContext('2d');
function bloom(amt) {
  if (amt <= .001) return;
  bax.globalCompositeOperation = 'copy'; bax.drawImage(cv, 0, 0, 480, 270);
  bbx.globalCompositeOperation = 'copy'; bbx.filter = 'contrast(2.4) brightness(1.1) saturate(1.35) blur(8px)'; bbx.drawImage(BA, 0, 0); bbx.filter = 'none';
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'screen'; main.globalAlpha = amt;
  main.drawImage(BB, 0, 0, W, H); main.restore();
}
const CA1 = document.createElement('canvas'); CA1.width = W; CA1.height = H; const ca1 = CA1.getContext('2d');
const CA2 = document.createElement('canvas'); CA2.width = W; CA2.height = H; const ca2 = CA2.getContext('2d');
function chroma(a) {
  if (a < .0006) return;
  ca1.globalCompositeOperation = 'copy'; ca1.drawImage(cv, 0, 0);
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = 'copy'; main.fillStyle = '#000'; main.fillRect(0, 0, W, H);
  main.globalCompositeOperation = 'lighter';
  [[2, '#ff0000'], [1, '#00ff00'], [0, '#0000ff']].forEach(([m, col]) => {
    const s = 1 + a * m;
    ca2.setTransform(s, 0, 0, s, 960 * (1 - s), 540 * (1 - s)); ca2.globalCompositeOperation = 'copy'; ca2.drawImage(CA1, 0, 0);
    ca2.setTransform(1, 0, 0, 1, 0, 0); ca2.globalCompositeOperation = 'multiply'; ca2.fillStyle = col; ca2.fillRect(0, 0, W, H);
    main.drawImage(CA2, 0, 0);
  });
  main.restore();
}
const GR = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry32(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 200; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
let GRP = null;
function grain(f) {
  if (!GRP) GRP = GR.map(c => main.createPattern(c, 'repeat'));
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalCompositeOperation = 'overlay'; main.globalAlpha = .06;
  main.translate(-((f * 53) % 256), -((f * 97) % 256));
  main.fillStyle = GRP[f % 3]; main.fillRect(0, 0, W + 256, H + 256);
  main.restore();
}
function composite(ts, alpha) {
  const { dx, dy } = shake(ts), s = 1 + Math.max(Math.abs(dx) / 960, Math.abs(dy) / 540);
  main.globalAlpha = alpha; main.globalCompositeOperation = 'source-over';
  main.setTransform(s, 0, 0, s, 960 * (1 - s) + dx, 540 * (1 - s) + dy);
  main.drawImage(scr, 0, 0);
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1;
}
function post(t, f) { bloom(bloomAmt(t)); chroma(caAmt(t)); grain(f); }
// motion blur budget; never blur across a hard cut
const CUTS = [8.0, 12.0, 15.0, 16.0, 20.0, 26.0, ...WORDS.map(w => w[0])];
const TRAVEL = [[3.55, 4.05], [7.2, 8.0], [8.0, 8.5], [15.72, 16.0], [19.25, 20.0], [20.0, 20.4], [22.5, 23.4], [25.2, 26.0], [11.55, 12.0]];
const FAST = [[1.8, 2.4], [3.2, 3.55], [4.05, 4.5], [CUT0, CUT1], [6.95, 7.4], [12.0, 15.78], [16.0, 17.3], [26.0, 26.75], [24.05, 24.6]];
function subN(t) {
  for (const [a, b] of TRAVEL) if (t >= a && t < b) return 20;
  for (const [a, b] of FAST) if (t >= a && t < b) return 10;
  if (t >= 16.0 && t < 26.0) return 6;
  return 4;
}
window.renderFrame = f => {
  const t0 = f / FPS, N = subN(t0);
  let lo = t0 - SHUTTER / FPS / 2, hi = t0 + SHUTTER / FPS / 2;
  for (const c of CUTS) { if (c > t0 && c < hi) hi = c - 1e-4; if (c <= t0 && c > lo) lo = c; }
  for (let i = 0; i < N; i++) {
    const ts = clamp(lo + (i + .5) / N * (hi - lo), 0, T - 1e-6);
    draw(ts); composite(ts, 1 / (i + 1));
  }
  post(t0, f);
  return N;
};
window.seek = t => { t = clamp(t, 0, T - 1e-6); draw(t); composite(t, 1); post(t, Math.round(t * FPS)); };

// ------------------------------------------------------------------ preview player
let playing = false, tcur = 0, last = null;
const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tc = document.getElementById('tc'), au = document.getElementById('au');
let audioOk = false; au.addEventListener('canplay', () => { audioOk = true; }); au.addEventListener('error', () => { audioOk = false; });
function setPlay(v) {
  playing = v; pp.textContent = v ? '❚❚' : '▶';
  if (audioOk) { if (v) { au.currentTime = tcur; au.play().catch(() => {}); } else au.pause(); }
}
function tick(now) {
  if (playing) {
    if (audioOk && !au.paused) tcur = au.currentTime;
    else if (last !== null) tcur += (now - last) / 1000;
    if (tcur >= T) { tcur = 0; if (audioOk) { au.currentTime = 0; au.play().catch(() => {}); } }
  }
  last = now;
  window.seek(tcur);
  sc.value = Math.round(tcur * FPS); tc.textContent = tcur.toFixed(2) + ' s / ' + T + ' s';
  requestAnimationFrame(tick);
}
function jump(t) { tcur = clamp(t, 0, T - 1 / FPS); if (audioOk) au.currentTime = tcur; }
pp.onclick = () => setPlay(!playing);
sc.oninput = () => jump(sc.value / FPS);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight') jump(tcur + (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'ArrowLeft') jump(tcur - (e.shiftKey ? .5 : 1 / FPS));
  else if (e.code === 'KeyR') { jump(0); setPlay(true); }
});

// ------------------------------------------------------------------ boot
(async () => {
  await Promise.all([SANS(100, 500), SANS(100, 600), SANS(100, 700), SANS(100, 800), SANS(100, 850), MONO(20)].map(f => document.fonts.load(f, 'AÉéèÀ’·×%0123456789')));
  await document.fonts.ready;
  initLayout();
  window.CUES = buildCues();
  window.ready = true;
  if (!RENDER) { const q = new URLSearchParams(location.search).get('t'); if (q) tcur = +q; requestAnimationFrame(tick); }
})();

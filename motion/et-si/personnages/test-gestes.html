<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Brico;src:url(../../claude-intro/fonts/bricolage.woff2)}@font-face{font-family:Anton;src:url(../../claude-intro/fonts/anton.woff2)}html,body{margin:0;background:#FBF4E8}svg{display:block}</style></head>
<body><svg id="s" width="2400" height="4300" viewBox="0 0 2400 4300"></svg>
<script src="rig2.js"></script><script src="gestes.js"></script>
<script>
const K = EtSi2; let s = '';
K.GESTES.forEach((g, i) => { const x = 120 + (i % 10) * 236, y = 380 + Math.floor(i / 10) * 400;
  s += K.leo(Object.assign({ x, y, scale: 0.5, t: i }, K.geste(g)));
  s += `<text x="${x}" y="${y + 30}" font-size="20" font-family="Brico" font-weight="800" text-anchor="middle" fill="#2B1D24">${i + 1}. ${g}</text>`; });
document.getElementById('s').innerHTML = s;
</script></body></html>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Short — maquette</title>
<style>
@font-face{font-family:Brico;src:url(../../claude-intro/fonts/bricolage.woff2)}
@font-face{font-family:Anton;src:url(../../claude-intro/fonts/anton.woff2)}
html,body{margin:0;background:#000}svg{display:block}text{font-family:Brico,sans-serif}
</style></head>
<body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="rig.js"></script>
<script>
// Maquette d'une image clé d'épisode : « Et si j'étais aveugle ? »
const { leo, max, canne } = EtSi;
let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD9A8"/><stop offset="1" stop-color="#FFF1DC"/></linearGradient></defs>`;
s += `<rect width="1080" height="1920" fill="url(#sky)"/>`;
// immeubles
const bld = [[-40, 760, 260, '#F4B9A0'], [200, 640, 230, '#F7CBA6'], [410, 820, 210, '#EBA98F'], [600, 700, 250, '#F4C29A'], [830, 780, 290, '#EFB494']];
for (const [x, y, w, c] of bld) {
  s += `<rect x="${x}" y="${y}" width="${w}" height="${1480 - y}" fill="${c}" stroke="#2A1F1D" stroke-width="4.5"/>`;
  for (let wy = y + 50; wy < 1380; wy += 110) for (let wx = x + 30; wx < x + w - 50; wx += 70)
    s += `<rect x="${wx}" y="${wy}" width="38" height="56" rx="6" fill="#FFF4E2" stroke="#2A1F1D" stroke-width="3.5" opacity=".9"/>`;
}
// trottoir + route
s += `<rect x="-10" y="1440" width="1100" height="520" fill="#D9CFC2" stroke="#2A1F1D" stroke-width="4.5"/>`;
s += `<path d="M-10 1520H1090" stroke="#2A1F1D" stroke-width="4.5"/>`;
s += `<rect x="-10" y="1700" width="1100" height="260" fill="#6B6E78"/>`;
// personnages
s += `<ellipse cx="350" cy="1600" rx="150" ry="16" fill="#000" opacity=".1"/>`;
s += `<ellipse cx="800" cy="1600" rx="140" ry="16" fill="#000" opacity=".1"/>`;
s += leo({ x: 350, y: 1600, scale: 1.2, expr: 'gene', look: [0, 0], acc: ['lunettesNoires'], arms: { l: [10, 10, 'relax'], r: [30, -40, 'fist'] } });
s += canne(492, 1340, -24, 0.9);
s += max({ x: 800, y: 1600, scale: 1.08, flip: true, expr: 'rire' });
// bulle de Vince
s += `<path d="M560 540H1030Q1056 540 1056 566V690Q1056 716 1030 716H880L830 790L840 716H560Q534 716 534 690V566Q534 540 560 540Z" fill="#FFF" stroke="#2A1F1D" stroke-width="5" stroke-linejoin="round"/>`;
s += `<text x="795" y="612" font-size="40" font-weight="800" fill="#2A1F1D" text-anchor="middle">« Eh, regarde où</text>`;
s += `<text x="795" y="666" font-size="40" font-weight="800" fill="#2A1F1D" text-anchor="middle">tu marches ! »</text>`;
// titre « Et si… »
s += `<rect x="90" y="190" width="900" height="250" rx="40" fill="#2A1F1D"/>`;
s += `<text x="540" y="300" font-size="96" fill="#F6B53D" text-anchor="middle" font-family="Anton" letter-spacing="6">ET SI…</text>`;
s += `<text x="540" y="392" font-size="62" font-weight="800" fill="#FFFFFF" text-anchor="middle">j'étais aveugle ?</text>`;
// sous-titre façon Shorts
s += `<text x="540" y="1840" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#2A1F1D" stroke-width="10" paint-order="stroke">Épisode 1</text>`;
document.getElementById('s').innerHTML = s;
</script></body></html>

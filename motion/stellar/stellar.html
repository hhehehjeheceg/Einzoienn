function glShot(t) {
  waterMat.uniforms.uT.value = t; skyMat.uniforms.uT.value = t;

    const a = io(seg(lt0, 0, 1.7)), c = io5(seg(lt0, 1.45, 3.9));
    const pA = V(b.p.x - 40 + a * 46, b.p.y + 14 + a * 6, b.p.z + 46 - a * 8);
    const dr = Math.max(0, lt0 - 3.9), pB = V(b.p.x + 40 - dr * 10, 175 - dr * 8, b.p.z + 120 - dr * 6);
    const look = lerpV(V(b.p.x, b.p.y + 13, b.p.z), V(b.p.x * .2, 0, 0), c);
    camLook(isleCam, lerpV(pA, pB, c), look, Math.sin(lt0 * .8) * .03 * (1 - c));

  }

  if (t < S.midas[0]) return false;

  if (t < S.poi[1]) {
    DAY(); showOnly(t < S.poi[0] ? null : clouds);
    const keys = ['agency', 'yacht', 'shark', 'rig'];
    if (t < S.poi[0]) {   // Midas: slow high orbit above the centre
      const k = lt(t, 'midas');
      camLook(isleCam, V(Math.sin(k * .2) * 30, 240 - k * 10, 150), V(0, 0, -10));
    } else {
      const k = lt(t, 'poi'); let i = 0; while (i < 3 && k >= CARD_T[i + 1]) i++;
      const f = k - CARD_T[i];
      // each spoken name: a quick whip from the previous POI to this one, then a slow drift
      const prev = i === 0 ? V(0, 0, -10) : POI_POS(keys[i - 1]), cur = POI_POS(keys[i]);
      const m = io5(seg(f, 0, .26)), tgt = lerpV(prev, cur, m);

    }

    render(isle, isleCam); return true;
  }
  // ---------------------------------------------------------------- Fantôme / Ombre: 2D only
  if (t < S.fade[0]) return false;
  // ---------------------------------------------------------------- the memory (polaroid of the island)
  if (t < S.fade[1]) {
    DAY(); showOnly(bus);
    const b = { p: V(-10, 44, 30), roll: .03, yaw: -.3 }; poseBus(b, t);
    camLook(isleCam, V(50, 46, 110), V(-14, 26, 10)); isleCam.fov = 50; isleCam.updateProjectionMatrix();

  }
  // ---------------------------------------------------------------- DROP: the Stellar star

    const land = spring(k - .02, 120, .74), sc = lerp(.05, 1.75, land);

    render(space, spaceCam); return true;
  }
  // ---------------------------------------------------------------- OG: dusk flyover with the bus far away
  if (t < S.og[1]) {
    DUSK(); showOnly(bus, clouds);
    const k = lt(t, 'og');
    poseBus({ p: V(-60 + k * 9, 95, -150), roll: .02, yaw: -.1 }, t);
    camLook(isleCam, V(-120 + k * 16, 24 + k * 2.5, 140 - k * 14), V(-20 + k * 10, 18, -40), -.04);

  // ---------------------------------------------------------------- features: calm nebula
  if (t < S.feat[1]) {
    const k = lt(t, 'feat');
    glSpace(t, { yaw: 1.2 + k * .025, pitch: -.05, bright: .8, hue: .2, starA: .9 });

    const k = lt(t, 'jump'), y = 330 - k * 95 - k * k * 22;
    diver.position.set(Math.sin(k * 2) * .6, y - 11.5, 2.2 + Math.cos(k * 1.7) * .4); diver.rotation.set(-Math.PI / 2 + .2, Math.sin(k * 1.3) * .25, Math.sin(k * 3) * .12);
    const roll = k * .45;

    const k = lt(t, 'isle');

}

const CX = W / 2;
// stacked "extruded" display word (Anton) with a gradient face, a darker depth and an optional glow
function slab(s, cx, y, size, face, o = {}) {
  const font = ANT(size), ls = o.ls ?? size * .02, w = tw(s, font, ls), depth = o.depth ?? Math.round(size * .06);
  ctx.save();
  ctx.translate(cx, y); if (o.rot) ctx.rotate(o.rot); if (o.sc) ctx.scale(o.sc, o.sc);
  ctx.font = font; ctx.letterSpacing = ls + 'px'; ctx.textAlign = 'center'; ctx.globalAlpha = o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 60; }
  for (let d = depth; d > 0; d -= 2) { ctx.fillStyle = rgb(o.side || [20, 18, 60]); ctx.fillText(s, d * .35, d); }
  ctx.shadowBlur = 0;
  if (Array.isArray(face) && Array.isArray(face[0])) {
    const g = ctx.createLinearGradient(0, -size * .8, 0, 0);
    face.forEach(([p, c]) => g.addColorStop(p, rgb(c))); ctx.fillStyle = g;
  } else ctx.fillStyle = rgb(face);
  ctx.fillText(s, 0, 0);
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = rgb(o.strokeCol || C.white, .9); ctx.strokeText(s, 0, 0); }
  ctx.restore(); ctx.globalAlpha = 1;
  return w;
}
// moving light band clipped to the glyphs of a centred word
const SHB = mk(W, 700);
function sheen(s, cx, y, font, ls, p, col = [255, 255, 255], a = .85, band = 220) {
  if (p <= 0 || p >= 1) return;
  const g = SHB.g; g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, 700);
  g.font = font; g.letterSpacing = ls + 'px'; g.textAlign = 'center'; g.fillStyle = '#000'; g.fillText(s, CX, 520);
  g.globalCompositeOperation = 'source-in';
  const w = tw(s, font, ls), x = CX - w / 2 - band + (w + band * 2) * p, gr = g.createLinearGradient(x - band / 2, 0, x + band / 2, 0);
  gr.addColorStop(0, rgb(col, 0)); gr.addColorStop(.5, rgb(col, a)); gr.addColorStop(1, rgb(col, 0));
  g.setTransform(1, 0, -.35, 1, 0, 0); g.fillStyle = gr; g.fillRect(-400, 0, W + 800, 700);
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(SHB.c, cx - CX, y - 520); ctx.globalCompositeOperation = 'source-over';
}
// glass card
function glass(x, y, w, h, r, a = 1, tint = C.deep, border = [C.violet, C.cyan]) {
  ctx.save(); ctx.globalAlpha = a;
  rr(x, y, w, h, r); ctx.fillStyle = rgb(tint, .62); ctx.fill();
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, rgb(border[0], .95)); g.addColorStop(1, rgb(border[1], .95));
  ctx.lineWidth = 3; ctx.strokeStyle = g; ctx.stroke();

function pill(s, cx, y, a, col = C.violet) {

// seeded burst of sparkles around a point (t = seconds since the burst)
function sparkBurst(seed, x, y, t, n = 18, R0 = 260, col = C.white) {
  if (t < 0 || t > 1.6) return;
  const r = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const a = r() * TAU, sp = .4 + r() * .6, d = R0 * sp * o5(seg(t, 0, 1.2)), life = 1 - seg(t, .2 + r() * .4, 1.3 + r() * .3);
    sparkle(x + Math.cos(a) * d, y + Math.sin(a) * d * .8, (8 + r() * 18) * life, life, col, r() * 3 + t * 2);
  }
}

function icon(kind, x, y, s, col = C.white) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100); ctx.fillStyle = rgb(col); ctx.strokeStyle = rgb(col); ctx.lineWidth = 6; ctx.lineJoin = 'round';
  if (kind === 'agency') {
    ctx.fillRect(-46, -6, 92, 40); ctx.fillRect(-60, 6, 14, 28); ctx.fillRect(46, 6, 14, 28);
    ctx.beginPath(); ctx.arc(0, -6, 22, Math.PI, 0); ctx.fill(); ctx.fillRect(-2, -42, 4, 14);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; for (let i = -3; i <= 3; i++) ctx.fillRect(i * 12 - 4, 6, 7, 10);
  } else if (kind === 'yacht') {
    ctx.beginPath(); ctx.moveTo(-60, 4); ctx.lineTo(56, 4); ctx.lineTo(40, 30); ctx.lineTo(-48, 30); ctx.closePath(); ctx.fill();
    ctx.fillRect(-36, -14, 64, 14); ctx.fillRect(-24, -30, 36, 14);
    ctx.beginPath(); ctx.moveTo(-70, 42); for (let i = 0; i <= 7; i++) ctx.quadraticCurveTo(-60 + i * 20, 34 + (i % 2 ? -8 : 8), -50 + i * 20, 42); ctx.stroke();
  } else if (kind === 'shark') {
    ctx.beginPath(); ctx.moveTo(-40, 26); ctx.quadraticCurveTo(-6, -10, 20, -46); ctx.quadraticCurveTo(14, -6, 40, 26); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-70, 34); for (let i = 0; i <= 7; i++) ctx.quadraticCurveTo(-60 + i * 20, 26 + (i % 2 ? -8 : 8), -50 + i * 20, 34); ctx.stroke();
  } else if (kind === 'rig') {

    ctx.beginPath(); ctx.moveTo(14, -4); ctx.lineTo(28, -58); ctx.lineTo(42, -4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(20, -28); ctx.lineTo(36, -28); ctx.stroke();
    for (const lx of [-40, -14, 14, 40]) ctx.fillRect(lx - 4, 8, 8, 30);

const clipCache = new Map();
function clipImg(clip, k) {

// ---- hits: [time, strength] drive shake, chroma and flashes; cuts get a whip zoom-blur

{ const g = VIG.g, gr = g.createRadialGradient(PW / 2, PH * .48, PH * .25, PW / 2, PH / 2, PH * .75); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = gr; g.fillRect(0, 0, PW, PH); }

  if (glRes) c.drawImage(glc, 0, 0); else { c.fillStyle = rgb(C.night); c.fillRect(0, 0, PW, PH); }
  L2D.g.setTransform(1, 0, 0, 1, 0, 0); L2D.g.clearRect(0, 0, PW, PH); L2D.g.setTransform(RS, 0, 0, RS, 0, 0);
  ctx = L2D.g; draw2D(t, glc);

  const h = hitAt(t), z = 1 + beatPunch(t) + h * .05, sx = (hash(Math.floor(t * 60) * 3 + 1) - .5) * 46 * h * RS, sy = (hash(Math.floor(t * 60) * 3 + 2) - .5) * 46 * h * RS;

async function renderFrame(f) {
  const tc = f / FPS;
  if (SUB <= 1) { await prefetchClips(tc); frame(tc); return; }
  const cut = CUTS.find(c => Math.abs(c - tc) < 1 / FPS);
  for (let i = 0; i < SUB; i++) {
    let t = Math.max(0, (f + ((i + .5) / SUB - .5) * SHUT) / FPS);
    if (cut !== undefined) t = tc >= cut ? Math.max(t, cut) : Math.min(t, cut - 1e-4);
    await prefetchClips(t); frame(t);
    ACC.g.globalAlpha = 1 / (i + 1); ACC.g.drawImage(out_cv, 0, 0);
  }
  ACC.g.globalAlpha = 1; main.drawImage(ACC.c, 0, 0);
}

{

  q(S.secret[0] - .3, 'swipe', .8); q(S.secret[0], 'stamp', 1);

  CARD_T.forEach(c => { q(S.poi[0] + c, 'whoosh', .5); q(S.poi[0] + c + .12, 'pop', .7); });
  q(S.sides[0], 'whoosh_big', .9); q(S.sides[0] + .28, 'impact_soft', .7); q(S.sides[0] + .82, 'pop', .8); q(S.sides[0] + 1.0, 'impact_soft', .7); q(S.sides[0] + 1.8, 'pop', .5);
  q(S.sides[1] - .3, 'swipe', .6);

window.CUES = CUES; window.VO = VO; window.S = S;

// ===== 99-boot.js =====
// ---- boot: fonts, optional gameplay clips, preview HUD (Space play/pause, arrows frame step, R replay)
window.seek = async t => { await prefetchClips(t); frame(t); };
window.renderFrame = renderFrame;
(async () => {
  await document.fonts.ready;
  await Promise.all(['Anton', 'InterV', 'Unbounded', 'JBM'].map(f => document.fonts.load(`40px ${f}`)));
  try {
    const r = await fetch('assets/gameplay/clips.json'); if (r.ok) { const j = await r.json(); CLIP_A = j.A || null; CLIP_B = j.B || null; }
  } catch (e) { /* no clips: the coded 3D shots play instead */ }
  await window.seek(0);
  window.ready = true;
  if (RENDER) return;
  const au = document.getElementById('au'), sc = document.getElementById('sc'), tc = document.getElementById('tc'), pp = document.getElementById('pp');
  let playing = false, t0 = 0, tStart = 0, cur = 0;
  const show = async t => { cur = clamp(t, 0, T - 1 / FPS); sc.value = Math.round(cur * FPS); tc.textContent = cur.toFixed(2) + ' s'; await window.seek(cur); };
  const loop = async now => { if (!playing) return; const t = tStart + (now - t0) / 1000; if (t >= T) { playing = false; pp.textContent = '▶'; return; } await show(t); requestAnimationFrame(loop); };
  const play = () => { playing = true; pp.textContent = '❚❚'; t0 = performance.now(); tStart = cur; au.currentTime = cur; au.play().catch(() => {}); requestAnimationFrame(loop); };
  const pause = () => { playing = false; pp.textContent = '▶'; au.pause(); };
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { pause(); show(sc.value / FPS); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight') { pause(); show(cur + 1 / FPS); }
    if (e.code === 'ArrowLeft') { pause(); show(cur - 1 / FPS); }
    if (e.code === 'KeyR') { pause(); cur = 0; play(); }
  });
})();
